name: Feature Request
description: Suggest a new MCP tool, feature, or enhancement for Didi
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Didi!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you're encountering.
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature, new MCP tool, or capability you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
