name: Didi CodeQL configuration

# The three vendored files recorded in THIRD_PARTY.md are excluded from
# analysis. Not to make a number look better -- to keep the Security tab
# meaning "something here needs attention".
#
# CodeQL's first run over this repository produced ten C++ findings. Five were
# integer-multiplication overflows, all of them inside stb_image_write.h, which
# is upstream code this project copies verbatim and is told not to modify (the
# file keeps its own copyright header, and updating it means replacing it with
# a new upstream release). Those five cannot be fixed here, would never be
# fixed here, and would sit open forever. Ten permanent alerts is how a
# security tab becomes something nobody opens, and the next real finding
# disappears into them.
#
# The exclusion is not a claim that the code is safe. The callers do the
# bounding: viewport captures are clamped to 4096x4096 with a 128 MB frame
# limit before any of this is reached. The risk of a vendored file is handled
# by the process in THIRD_PARTY.md -- knowing what is in the tree and what
# updating it involves -- rather than by an alert nobody can action.
#
# json.hpp is excluded for the same reason and with more care owed: it parses
# every request from an MCP client, so THIRD_PARTY.md says to treat a change to
# it as a change to code on the untrusted input path. The fuzz targets in
# fuzz/ exercise it through this project's own parsers, which is the coverage
# that actually applies to how Didi uses it.

paths-ignore:
  - include/didi/common/json.hpp
  - include/didi/common/stb_image_write.h
  - include/didi/gdextension/gdextension_interface.h
