name: Didi Fast & Efficient CI

# Triggered on every push and pull request rather than by a duplicated path
# list. Path filters at this level skip the whole workflow, which means a
# required status check never reports and the pull request can never merge.
# The `changes` job below decides what actually needs to run, so a docs-only
# change still reports a result instead of leaving an empty check.
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege by default. Any job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One cheap job decides what the expensive ones do. Before this, a change to
  # a single Markdown file started two 30-minute Windows Godot editor runs and
  # a sanitizer build that could not possibly observe it.
  changes:
    name: Decide what needs to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
      engine: ${{ steps.classify.outputs.engine }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Fail towards running more, never less. If the diff cannot be
          # computed the answer is "run everything", because a skipped job
          # that should have run is a defect that reaches main.
          changed=""
          case "$EVENT_NAME" in
            pull_request)
              changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || echo "__ALL__")
              ;;
            push)
              if [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                changed=$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" || echo "__ALL__")
              else
                changed="__ALL__"
              fi
              ;;
            *)
              changed="__ALL__"
              ;;
          esac

          if [ -z "$changed" ] || [ "$changed" = "__ALL__" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "Running everything (no usable diff for a $EVENT_NAME event)."
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | awk '{ print "  " $0 }'

          # Anything that cannot reach the compiler, the tool manifest, the
          # documentation contract, or any test. Everything else builds.
          #
          # AI.md is prose about how this repository gets built. It states no
          # count the manifest owns, so the documentation contract that runs
          # against the built binary has nothing in it to check; its links are
          # covered by Validate Docs, which needs no build at all.
          build_ignored='^(docs/brand/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|\.github/FUNDING\.yml$|\.github/CODEOWNERS$|\.github/labeler\.yml$|\.github/release\.yml$|\.github/workflows/(codeql|supply-chain|triage)\.yml$|\.editorconfig$|\.gitattributes$|\.gitignore$|LICENSE$|CODE_OF_CONDUCT\.md$|AI\.md$)'

          # Only these can change what a running Godot editor or a sanitizer
          # build observes. Prose cannot, which is the whole point.
          engine_relevant='^(src/|include/|tests/|addons/|demo/|cmake/|resources/|schemas/|tools/|CMakeLists\.txt$|requirements-dev\.txt$|\.github/workflows/ci\.yml$)'

          build=false
          engine=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! printf '%s\n' "$file" | grep -Eq "$build_ignored"; then
              build=true
            fi
            if printf '%s\n' "$file" | grep -Eq "$engine_relevant"; then
              engine=true
            fi
          done <<< "$changed"

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "build=$build engine=$engine"

  fast-build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Remove Unused Homebrew Tap (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi

      # POSIX only. The Windows job uses the Visual Studio generator, which
      # ignores CMAKE_<LANG>_COMPILER_LAUNCHER, and its configure step never set
      # one, so installing ccache there cached nothing and only cost time.
      - name: Setup Compiler Cache (ccache)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build build-essential

      - name: Install Build Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Select Python Interpreter
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && command -v python >/dev/null 2>&1; then
            echo "DIDI_PYTHON=python" >> "$GITHUB_ENV"
          elif command -v python3 >/dev/null 2>&1; then
            echo "DIDI_PYTHON=python3" >> "$GITHUB_ENV"
          elif command -v python >/dev/null 2>&1; then
            echo "DIDI_PYTHON=python" >> "$GITHUB_ENV"
          else
            echo "No Python interpreter is available" >&2
            exit 1
          fi

      - name: Install and verify schema dependencies
        shell: bash
        run: |
          # PEP 668: the macOS runner's Python is externally managed, so a plain
          # pip install fails. Install into a virtual environment rather than
          # forcing a global install with --break-system-packages, which the
          # runner warns can break its own Homebrew Python.
          "$DIDI_PYTHON" -m venv .venv-dev
          VENV_PY=".venv-dev/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY=".venv-dev/Scripts/python.exe"
          "$VENV_PY" -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          # The expected version is read from requirements-dev.txt rather than
          # written out here as well. While the literal lived in both places, a
          # dependency bump could only ever open a pull request that failed
          # until someone edited this line, so Python updates were switched off
          # entirely. One source, and the bump is reviewable.
          "$VENV_PY" - << 'EOF'
          import pathlib
          import re
          import sys

          from importlib.metadata import version

          # importlib.metadata rather than jsonschema.__version__. The
          # attribute is deprecated as of 4.26.0 and its own warning says it
          # will be removed, at which point this check would raise
          # AttributeError and take the release gate down with it. The
          # deprecation surfaced on the 4.26.0 bump, before it could bite.
          installed = version('jsonschema')

          pin = re.search(r'^jsonschema==([^\s#]+)', pathlib.Path('requirements-dev.txt').read_text(encoding='utf-8'), re.M)
          if pin is None:
              sys.exit('requirements-dev.txt no longer pins an exact jsonschema version')
          if installed != pin.group(1):
              sys.exit(f'installed jsonschema {installed}, pinned {pin.group(1)}')
          print(f'jsonschema {installed} matches the pin')
          EOF
          echo "DIDI_SCHEMA_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          # CMake gets the same interpreter, because ctest's Python suite is
          # this build tree's and two of its modules import jsonschema at module
          # scope. The interpreter CMake finds on its own is the runner's, which
          # does not have it: on macOS that is deliberate, since PEP 668 is why
          # the dependencies are in a virtual environment at all. release.yml
          # already hands CMake this path, which is the only reason the release
          # job's ctest could import those modules while a pull request could
          # not have.
          #
          # Absolute, and on Windows in the form CMake executes: this step runs
          # in bash, so $PWD there is a /d/a/... path CMake cannot run.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "DIDI_CMAKE_PYTHON=$(cygpath -m "$PWD/$VENV_PY")" >> "$GITHUB_ENV"
          else
            echo "DIDI_CMAKE_PYTHON=$PWD/$VENV_PY" >> "$GITHUB_ENV"
          fi

      - name: Run Phase 7 schema and ownership contracts
        shell: bash
        run: |
          "$DIDI_SCHEMA_PYTHON" -m unittest tests.test_phase7_schema_contract tests.test_phase7_plan_ownership tests.test_phase7_signal_admission -v

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$DIDI_CMAKE_PYTHON"

      - name: Configure CMake (POSIX Ninja)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython3_EXECUTABLE="$DIDI_CMAKE_PYTHON"

      - name: Compile Targets in Parallel
        run: cmake --build build --config Release --parallel

      - name: Verify the staged addon is complete and clean
        shell: bash
        run: |
          # Release packaging copies this directory verbatim. A missing file
          # ships an addon Godot cannot start, and an extra one ships whatever
          # a tool happened to generate in place. The source addon directory
          # used to be the packaging source and shipped both kinds of mistake.
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) library="bin/didi_extension.dll" ;;
            macOS)   library="bin/libdidi_extension.dylib" ;;
            *)       library="bin/libdidi_extension.so" ;;
          esac
          expected="$library didi.gdextension didi_await.gd didi_brand.gd didi_client_config.gd didi_console.gd didi_diagnostics.gd didi_log.gd didi_mark.svg didi_mark_compact.svg didi_plugin.gd didi_session.gd didi_settings.gd didi_signature.svg plugin.cfg "
          actual=$(cd build/addons/didi && LC_ALL=C find . -type f | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')
          if [ "$actual" != "$expected" ]; then
            echo "Staged addon is [$actual]" >&2
            echo "Expected          [$expected]" >&2
            exit 1
          fi
          echo "Staged addon verified"

      - name: Run Native Tests (including fake-live cursor routing)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/didi_tests.exe
          else
            ./build/didi_tests
          fi

      - name: Run The Suites The Way The Release Runs Them
        shell: bash
        run: |
          # The release workflow gates a tag on `ctest`, and nothing else ran
          # it. Every step above runs the native binary directly and then names
          # Python modules one at a time, in separate processes and separate
          # jobs; ctest runs one process over all of them through unittest
          # discovery. That is a different composition, and the 1.8.0 release
          # was the first thing to execute it -- which it did for thirty-four
          # minutes before it was cancelled.
          #
          # A release must not be the first run of a command. This is the same
          # invocation release.yml uses, so the tag can no longer be the place
          # it is tried.
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify the published test counts match the suites that ran
        shell: bash
        run: |
          # The test total used to be a number typed into a guide, and it was
          # wrong for long enough that the documentation validator had to grow
          # a rule forbidding the stale sentence. The counts are now derived
          # from the binary's own registry and from unittest discovery, and
          # this step fails when the committed inventory disagrees.
          #
          # The published figures are the Windows ones, because the native
          # suite is platform-conditional: crash capture is Windows-only, and
          # the IPC cases differ between a named pipe and a Unix socket. The
          # tool knows that and reports a skip on the POSIX runners rather than
          # a failure, so the gate is kept in one place rather than split
          # between here and an `if:` condition.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export DIDI_TEST_BINARY="$PWD/build/Release/didi_tests.exe"
          else
            export DIDI_TEST_BINARY="$PWD/build/didi_tests"
          fi
          "$DIDI_PYTHON" tools/test_inventory.py --check

      - name: Validate Documentation Against Built Tool Surface
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/didi.exe --dump-tool-manifest > build/tool_manifest.json
          else
            ./build/didi --dump-tool-manifest > build/tool_manifest.json
          fi
          "$DIDI_PYTHON" tools/validate_documentation.py --tool-manifest build/tool_manifest.json

      - name: Verify Managed Recovery Startup Contract
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export DIDI_TEST_BINARY="$PWD/build/Release/didi.exe"
          else
            export DIDI_TEST_BINARY="$PWD/build/didi"
          fi
          "$DIDI_PYTHON" -m unittest tests.test_managed_recovery -v

      - name: Verify declared output schemas describe real results
        shell: bash
        run: |
          # Runs after the build because it exercises the tools through the
          # built binary and validates each payload against the schema the
          # server publishes for it.
          "$DIDI_SCHEMA_PYTHON" -m unittest tests.test_tool_output_schema_contract -v

      - name: Verify human confirmation reaches a human
        shell: bash
        run: |
          # Drives the real binary: a client that can elicit is asked to approve
          # a destructive change, decline and cancel stay distinguishable, and a
          # client that cannot elicit is never silently downgraded into looking
          # approved.
          "$DIDI_SCHEMA_PYTHON" -m unittest tests.test_elicitation_confirmation -v

      - name: Verify YOLO mode is launch-only and visible
        shell: bash
        run: |
          # The load-bearing assertion is that no tool argument can turn
          # confirmations off. An agent able to authorise its own bypass would
          # make the confirmation system decorative.
          "$DIDI_SCHEMA_PYTHON" -m unittest tests.test_yolo_mode -v

      - name: Verify the Control Room page and its MCP Apps contract
        shell: bash
        run: |
          # The page half is static: no path from data to markup, no external
          # origin, and the embedding round-trips byte for byte. The protocol
          # half drives the binary, because the bilateral extension gate is a
          # property of what a given client is actually served.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export DIDI_TEST_BINARY="$PWD/build/Release/didi.exe"
          else
            export DIDI_TEST_BINARY="$PWD/build/didi"
          fi
          "$DIDI_SCHEMA_PYTHON" -m unittest tests.test_control_room_app tests.test_control_room_protocol -v

      - name: Verify the command line refuses unknown and malformed options
        shell: bash
        run: |
          # A typo used to start the server as though the launch had succeeded,
          # and a value option could swallow the flag after it, so an operator
          # could ask for a mode and quietly start without it.
          "$DIDI_PYTHON" -m unittest tests.test_cli_arguments -v

      - name: Verify the tests drive the build that was just made
        shell: bash
        run: |
          # A machine with both a build/ and a build-ninja/ tree used to run the
          # end to end tests against whichever the candidate list named first,
          # which was the older one often enough to cost real debugging time. A
          # stale binary answers every request perfectly well, just as the wrong
          # version, so nothing about the failure says what went wrong.
          "$DIDI_PYTHON" -m unittest tests.test_didi_binary -v

      - name: Validate Internal Markdown Links
        shell: bash
        run: |
          "$DIDI_PYTHON" - << 'EOF'
          import pathlib
          import re
          import sys
          from urllib.parse import unquote

          repo = pathlib.Path.cwd().resolve()
          failures = []
          markdown = [pathlib.Path('README.md'), pathlib.Path('CHANGELOG.md')]
          markdown.extend(pathlib.Path('docs').rglob('*.md'))
          link_pattern = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')

          required_claims = {
              pathlib.Path('README.md'): (
                  'sessionKind', '$XDG_RUNTIME_DIR/didi-sessions', '17-second outer transport deadline'),
              pathlib.Path('CHANGELOG.md'): (
                  'session-kind-aware', '15-second extension deadline',
                  '$XDG_RUNTIME_DIR/didi-sessions'),
              pathlib.Path('docs/DEVELOPER_GUIDE.md'): (
                  "runner's reported total is authoritative",
                  'Coverage is organized by contract'),
              pathlib.Path('docs/CAPABILITIES.md'): (
                  'sessionKind', 'connected wrong-kind route', '$XDG_RUNTIME_DIR/didi-sessions'),
              pathlib.Path('docs/API_SPECIFICATION.md'): (
                  '17-second outer transport deadline', 'outcome: "unknown_outcome"',
                  'POSIX intentionally retains'),
              pathlib.Path('docs/ARCHITECTURE.md'): (
                  'No live path waits forever', '.didi-retired-<session-id>-<32hex>'),
              pathlib.Path('docs/TOOL_REFERENCE.md'): (
                  'POSIX normally retains', '<OS temp>/didi-sessions-<euid>'),
          }
          forbidden_claims = {
              pathlib.Path('README.md'): (
                  "under the OS temporary directory's `didi-sessions` child",),
              pathlib.Path('CHANGELOG.md'): (
                  'already-running main-thread work returns a definitive result',
                  'same definitive-response contract'),
              pathlib.Path('docs/DEVELOPER_GUIDE.md'): ('Didi currently includes 23 native tests',),
              pathlib.Path('docs/CAPABILITIES.md'): (
                  'liveAvailable means the tool has a live implementation and the Godot editor IPC connection is active',),
              pathlib.Path('docs/API_SPECIFICATION.md'): (
                  "A command already running on Godot's main thread is allowed to return its definitive result",),
              pathlib.Path('docs/ARCHITECTURE.md'): (
                  'wait for the definitive result instead of returning an ambiguous timeout',),
              pathlib.Path('docs/TOOL_REFERENCE.md'): ('re-verify it, and normally delete it',),
          }

          def heading_anchors(path):
              anchors = set()
              seen = {}
              text = path.read_text(encoding='utf-8')
              for line in text.splitlines():
                  match = re.match(r'^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$', line)
                  if not match:
                      continue
                  heading = re.sub(r'<[^>]+>', '', match.group(1))
                  heading = re.sub(r'!?\[([^\]]*)\]\([^)]*\)', r'\1', heading)
                  heading = heading.replace('`', '').lower()
                  slug = re.sub(r'[^\w\- ]', '', heading, flags=re.UNICODE)
                  slug = re.sub(r'\s', '-', slug).strip('-')
                  duplicate = seen.get(slug, 0)
                  seen[slug] = duplicate + 1
                  anchors.add(slug if duplicate == 0 else f'{slug}-{duplicate}')
              anchors.update(re.findall(r'<a\s+(?:name|id)=["\']([^"\']+)["\']', text, re.I))
              return anchors

          anchor_cache = {}
          for source, phrases in required_claims.items():
              text = source.read_text(encoding='utf-8')
              for phrase in phrases:
                  if phrase not in text:
                      failures.append(f'{source}: missing required contract text: {phrase}')
          for source, phrases in forbidden_claims.items():
              text = source.read_text(encoding='utf-8')
              for phrase in phrases:
                  if phrase in text:
                      failures.append(f'{source}: stale contract text remains: {phrase}')

          for source in markdown:
              text = source.read_text(encoding='utf-8')
              text = re.sub(r'```.*?```', '', text, flags=re.DOTALL)
              for raw in link_pattern.findall(text):
                  target = raw.strip().split()[0].strip('<>')
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  file_part, separator, fragment = target.partition('#')
                  candidate = source if not file_part else source.parent / unquote(file_part)
                  resolved = candidate.resolve()
                  try:
                      resolved.relative_to(repo)
                  except ValueError:
                      failures.append(f'{source}: target escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      failures.append(f'{source}: missing {target}')
                      continue
                  if separator and fragment and resolved.suffix.lower() == '.md':
                      anchors = anchor_cache.setdefault(resolved, heading_anchors(resolved))
                      decoded = unquote(fragment).lower()
                      if decoded not in anchors:
                          failures.append(f'{source}: missing anchor {target}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated internal links in {len(markdown)} Markdown files')
          EOF

      - name: Run End-to-End MCP Integration Test
        shell: bash
        run: |
          "$DIDI_PYTHON" - << 'EOF'
          import subprocess
          import json
          import os

          exe = './build/Release/didi.exe' if os.name == 'nt' else './build/didi'
          project_root = os.path.abspath('tests/godot_smoke')
          proc = subprocess.Popen([exe, '--project', project_root], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          def req(method, params, i):
              proc.stdin.write(json.dumps({'jsonrpc': '2.0', 'id': i, 'method': method, 'params': params}) + '\n')
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  raise RuntimeError(proc.stderr.read() or f'didi exited with status {proc.poll()}')
              return json.loads(line)

          # Both metadata fields are required on every modern request, so build
          # them together. A half envelope is a request the server has to
          # refuse, and writing one by hand three times is how it got baked in.
          def modern_meta(version='2026-07-28', capabilities=None):
              return {'_meta': {
                  'io.modelcontextprotocol/protocolVersion': version,
                  'io.modelcontextprotocol/clientCapabilities': capabilities or {}}}

          # Dual-era discovery, asserted on the wire. A modern client probes with
          # server/discover before any handshake, so this must answer cold.
          discover = req('server/discover', {}, 900)['result']
          assert discover['resultType'] == 'complete'
          # Every advertised version must actually be served. Asserting the
          # invariant beats asserting the list: the list changes, the rule does not.
          for version in discover['supportedVersions']:
              probe = req('tools/list', modern_meta(version), 902)
              assert 'error' not in probe, (version, probe)
              assert probe['result']['resultType'] == 'complete', version
          assert discover['_meta']['io.modelcontextprotocol/serverInfo']['name'] == 'didi'
          # Caching hints are required on a complete result; a missing ttlMs
          # is read as immediately stale, which discards the hint silently.
          assert discover['ttlMs'] >= 0 and discover['cacheScope'] == 'public'
          # A version Didi does not serve must fail actionably.
          unsupported = req('tools/list', modern_meta('1900-01-01'), 901)
          assert unsupported['error']['code'] == -32022, unsupported
          assert '2024-11-05' in unsupported['error']['data']['supported']
          # Session-dependent results must never claim a freshness window: a
          # cached availability answer goes stale the moment an editor starts.
          modern = modern_meta()
          for method in ('tools/list', 'resources/list'):
              live = req(method, modern, 903)['result']
              assert live['ttlMs'] == 0 and live['cacheScope'] == 'private', (method, live)
          static_list = req('prompts/list', modern, 904)['result']
          assert static_list['ttlMs'] > 0 and static_list['cacheScope'] == 'public'
          # The catalogue is cacheable for an hour, so a description that
          # disagrees with the rendered result stays on a person's screen that
          # long (#512). One description per prompt, from one place.
          prompt_args = {
              'godot_debug_visual_anomaly': {'target_resource_path': 'res://x'},
              'godot_generate_gameplay_slice': {'feature_name': 'F', 'requirements': 'R'},
          }
          for listed_prompt in static_list['prompts']:
              prompt_name = listed_prompt['name']
              assert prompt_name in prompt_args, prompt_name
              # Modern metadata, because this block runs before the legacy
              # initialize handshake below.
              fetched = req('prompts/get', dict(
                  modern, name=prompt_name, arguments=prompt_args[prompt_name]
              ), 905)
              assert 'error' not in fetched, fetched
              assert fetched['result']['description'] == listed_prompt['description'], prompt_name
          # An unknown prompt argument is refused the way an unknown tool
          # argument is, rather than accepted and dropped (#511).
          bad_prompt = req('prompts/get', dict(
              modern,
              name='godot_debug_visual_anomaly',
              arguments={'target_resource_path': 'res://x', 'bogus': '1'},
          ), 908)
          assert bad_prompt['error']['code'] == -32602, bad_prompt
          assert 'bogus' in bad_prompt['error']['message']
          assert bad_prompt['error']['data']['argument'] == 'bogus'

          assert req('initialize', {'protocolVersion': '2024-11-05'}, 1)['result']['serverInfo']['name'] == 'didi'
          tools = req('tools/list', {}, 2)['result']['tools']
          by_name = {tool['name']: tool for tool in tools}
          # Verify the live wire surface against the manifest this same binary
          # emits, rather than against numbers written into this workflow.
          # Implementing a reserved tool then updates both sides at once.
          with open('build/tool_manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          legacy_names = set(manifest['names']['legacy'])
          assert set(by_name) == set(manifest['names']['canonical']) | legacy_names
          assert len(tools) == manifest['counts']['total']
          assert len(legacy_names) == manifest['counts']['legacy']
          assert len(set(by_name) - legacy_names) == manifest['counts']['canonical']
          for name in manifest['names']['unimplemented']:
              assert by_name[name]['_meta']['didi']['implemented'] is False, name
          for name in manifest['names']['implemented']:
              assert by_name[name]['_meta']['didi']['implemented'] is True, name

          # Annotations decide what a client may auto-approve, so the safety
          # invariant is asserted on the wire: no tool that advertises dry_run
          # may ever claim to be read-only.
          for name, tool in by_name.items():
              annotations = tool['annotations']
              for hint in ('readOnlyHint', 'destructiveHint', 'idempotentHint', 'openWorldHint'):
                  assert isinstance(annotations[hint], bool), (name, hint)
              if 'dry_run' in tool['inputSchema'].get('properties', {}):
                  assert annotations['readOnlyHint'] is False, name
          assert any(t['annotations']['readOnlyHint'] for t in by_name.values())
          # The two tools that change the attachment every later live call
          # routes through are not reads, whatever else they are (#505).
          for name in ('runtime_attach_session', 'runtime_detach_session'):
              assert by_name[name]['annotations']['readOnlyHint'] is False, name
          # destructiveHint and idempotentHint used to be derived from the same
          # bit as readOnlyHint, so across the whole surface the four hints took
          # exactly four shapes and the last two said nothing (#507). Assert the
          # census, not a list: the list changes, the rule does not.
          shapes = {json.dumps(t['annotations'], sort_keys=True) for t in by_name.values()}
          assert len(shapes) > 4, sorted(shapes)
          for name in ('scene_set_property', 'project_set_setting', 'blackboard_write'):
              assert by_name[name]['annotations']['idempotentHint'] is True, name
          for name in ('scene_instantiate_node', 'blackboard_task_create'):
              assert by_name[name]['annotations']['destructiveHint'] is False, name
          # A writer taking an overwrite flag can replace a file, so it stays
          # destructive however additive its name reads.
          for name in ('script_create', 'scene_create', 'resource_create'):
              assert by_name[name]['annotations']['destructiveHint'] is True, name

          # openWorldHint is per tool, not a blanket false. A tool that starts
          # Godot or dotnet against the project runs code the project chose, so
          # a client cannot treat it as a closed local call.
          open_world = {
              'csharp_check_build', 'shader_check_compile', 'project_export',
              'gridmap_export_mesh_library', 'runtime_launch', 'execute_test_session',
              'script_check_syntax', 'analyze_script_diagnostics',
          }
          for name in open_world:
              assert by_name[name]['annotations']['openWorldHint'] is True, name
          for name in ('scene_get_hierarchy', 'project_list_resources', 'resource_create'):
              assert by_name[name]['annotations']['openWorldHint'] is False, name
          assert not (open_world - set(by_name)), open_world - set(by_name)
          assert by_name['scene_get_hierarchy']['_meta']['didi']['implemented'] is True
          assert by_name['script_attach_to_node']['_meta']['didi']['implemented'] is True
          assert by_name['script_attach_to_node']['_meta']['didi']['executionModes'] == ['live']
          # Spot-checks either side of the Phase 7 partial delivery. The loops
          # above already derive both sets from the manifest; these name one
          # delivered and one reserved tool so a reader can see the split.
          assert by_name['signal_connect']['_meta']['didi']['implemented'] is True
          assert by_name['signal_connect']['_meta']['didi']['executionModes'] == ['live']
          for name in ('tilemap_set_cells', 'tilemap_get_used_rect', 'gridmap_set_cells'):
              assert by_name[name]['_meta']['didi']['implemented'] is True
              assert by_name[name]['_meta']['didi']['executionModes'] == ['live']
          assert by_name['runtime_list_sessions']['_meta']['didi']['executionModes'] == ['local_session_management']
          assert by_name['runtime_get_session']['_meta']['didi']['executionModes'] == ['local_session_management']
          assert by_name['runtime_read_logs']['_meta']['didi']['executionModes'] == ['live']
          assert by_name['runtime_read_logs']['inputSchema']['properties']['cursor']['default'] == 0
          assert by_name['runtime_read_logs']['inputSchema']['properties']['cursor']['minimum'] == 0
          assert by_name['runtime_read_logs']['inputSchema']['properties']['limit']['maximum'] == 500
          assert by_name['runtime_get_tree']['inputSchema']['properties']['root_path']['maxLength'] == 1024
          assert by_name['eval_gdscript']['_meta']['didi']['executionModes'] == ['live']
          assert by_name['eval_gdscript']['_meta']['didi']['implemented'] is True
          assert by_name['eval_gdscript']['inputSchema']['properties']['expression']['maxLength'] == 2048
          assert by_name['eval_gdscript']['inputSchema']['properties']['context_node']['maxLength'] == 1024
          assert by_name['eval_gdscript']['inputSchema']['properties']['timeout_ms']['maximum'] == 5000
          assert by_name['project_search_text']['_meta']['didi']['executionModes'] == ['local']
          assert by_name['project_search_text']['inputSchema']['properties']['max_results']['maximum'] == 500
          assert by_name['project_search_symbols']['_meta']['didi']['executionModes'] == ['local']
          assert by_name['asset_reimport']['_meta']['didi']['executionModes'] == ['live']
          assert by_name['asset_reimport']['inputSchema']['properties']['paths']['maxItems'] == 256
          assert by_name['viewport_diff_capture']['_meta']['didi']['executionModes'] == ['live']
          assert by_name['viewport_diff_capture']['inputSchema']['properties']['threshold']['maximum'] == 255
          assert by_name['viewport_diff_capture']['inputSchema']['properties']['baseline_capture_id']['pattern'] == '^[0-9a-f]{32}$'
          for name in (
              'csharp_check_build', 'shader_check_compile', 'project_list_export_presets',
              'project_export', 'gridmap_export_mesh_library'
          ):
              assert by_name[name]['_meta']['didi']['implemented'] is True
              assert by_name[name]['_meta']['didi']['executionModes'] == ['local']
          assert by_name['csharp_check_build']['inputSchema']['properties']['timeout_seconds']['maximum'] == 300
          assert by_name['shader_check_compile']['inputSchema']['required'] == ['shader_path']
          assert by_name['project_list_export_presets']['inputSchema']['properties'] == {}
          assert by_name['project_export']['inputSchema']['properties']['timeout_seconds']['maximum'] == 900
          assert by_name['project_export']['inputSchema']['properties']['overwrite']['default'] is False
          assert by_name['gridmap_export_mesh_library']['inputSchema']['properties']['generate_collisions']['default'] is True
          assert by_name['gridmap_export_mesh_library']['inputSchema']['properties']['overwrite']['default'] is False
          assert by_name['ui_hit_test']['_meta']['didi']['implemented'] is True
          assert by_name['ui_hit_test']['_meta']['didi']['executionModes'] == ['live']
          assert by_name['ui_hit_test']['inputSchema']['properties']['max_results']['maximum'] == 256
          assert by_name['ui_hit_test']['inputSchema']['required'] == ['point']
          assert by_name['runtime_get_call_stack']['_meta']['didi']['implemented'] is False
          assert by_name['runtime_get_call_stack']['_meta']['didi']['executionModes'] == ['unimplemented']
          for name in ('runtime_read_profiler', 'runtime_inject_input', 'inject_input_event',
                       'physics_raycast_query', 'nav_query_path', 'anim_list_tracks', 'anim_play_track'):
              assert by_name[name]['_meta']['didi']['implemented'] is True
              assert by_name[name]['_meta']['didi']['executionModes'] == ['live']

          # #418 closed arguments by default and the schemas did not follow:
          # 73 of 126 published no additionalProperties, so by JSON Schema they
          # accepted anything while the server refused the same call. A client
          # validating locally before sending passed, and then lost a round
          # trip (#508).
          for name, tool in by_name.items():
              schema = tool['inputSchema']
              assert schema.get('additionalProperties') is False, (name, schema)
          probe = req('tools/call', {
              'name': 'scene_get_property',
              'arguments': {'target_node': '/root/Main', 'property_name': 'position', 'bogus': 1}
          }, 906)['result']
          assert probe['isError'] is True
          assert 'bogus' in probe['content'][0]['text']

          # An outputSchema is a claim about the handler. scene_get_hierarchy
          # named a field it never returns and stayed silent about nine it does
          # (#510), so every key a real answer carries must be declared.
          for name, args in (
              ('project_search_text', {'query': 'extends'}),
              ('project_list_resources', {}),
              ('scene_get_hierarchy', {'root_path': 'res://main.tscn'}),
          ):
              declared = set(by_name[name]['outputSchema']['properties'])
              answer = req('tools/call', {'name': name, 'arguments': args}, 907)['result']
              assert not answer.get('isError'), (name, answer)
              returned = set(answer['structuredContent'])
              assert returned <= declared, (name, sorted(returned - declared))
              for field in by_name[name]['outputSchema'].get('required', []):
                  assert field in returned, (name, field)

          # A tool with no live path has nothing to fall back from, so neither
          # the entry a host reads nor the answer it gets may say fallback. #419
          # fixed the answers and the entry kept the old word, which is how
          # eleven tools came to advertise one mode and report another (#503).
          for name, tool in by_name.items():
              meta = tool['_meta']['didi']
              if not meta['implemented'] or 'live' in meta['executionModes']:
                  continue
              assert 'offline_fallback' not in meta['executionModes'], (name, meta)
              assert meta['currentMode'] != 'offline_fallback', (name, meta)
              assert meta['executionModes'] == [meta['currentMode']], (name, meta)

          project = json.loads(req('resources/read', {'uri': 'godot://project/tree'}, 3)['result']['contents'][0]['text'])
          # A filesystem index with no live path, so there is nothing for it
          # to have fallen back from. The resources were swept into the
          # vocabulary #419 settled on for the tools (#533).
          assert project['execution_mode'] == 'local'
          assert project['total_resources'] > 0

          hierarchy = json.loads(req('tools/call', {
              'name': 'get_scene_hierarchy',
              'arguments': {'root_path': 'res://main.tscn'}
          }, 4)['result']['content'][0]['text'])
          assert hierarchy['execution_mode'] == 'offline_fallback'
          assert hierarchy['scene_tree']['path'].startswith('/root/')
          assert len(hierarchy['scene_tree']['children']) >= 1

          # Boards are created on demand, so resources/list can only publish the
          # two on `default`. The parameterised shape is what lets a client find
          # any other board, and an unwritten board must not read like an empty
          # one (#514). Every board is application/json, not just the registered
          # one (#513).
          templates = req('resources/templates/list', {}, 6)['result']
          template_uris = [t['uriTemplate'] for t in templates['resourceTemplates']]
          assert template_uris == ['blackboard://{board}/state', 'blackboard://{board}/tasks'], template_uris
          assert templates['cacheScope'] == 'public' and templates['ttlMs'] > 0
          for board_uri in ('blackboard://default/state', 'blackboard://other/state',
                            'blackboard://other/tasks'):
              entry = req('resources/read', {'uri': board_uri}, 7)['result']['contents'][0]
              assert entry['mimeType'] == 'application/json', (board_uri, entry['mimeType'])
              assert json.loads(entry['text'])['board'] == board_uri.split('/')[2], board_uri
          unwritten = json.loads(req('resources/read', {
              'uri': 'blackboard://never-created-at-all/state'
          }, 8)['result']['contents'][0]['text'])
          assert unwritten['exists'] is False, unwritten

          # Each malformed shape names the part that was actually wrong, rather
          # than blaming the one segment that was fine (#515).
          bad_uris = {
              'blackboard://default/nope': 'kind',
              'blackboard://default/state?x=1': 'query string',
              'blackboard://../../etc/state': 'board name',
          }
          for bad_uri, expected in bad_uris.items():
              failed = req('resources/read', {'uri': bad_uri}, 9)
              assert 'error' in failed, (bad_uri, failed)
              assert expected in failed['error']['message'], (bad_uri, failed['error']['message'])

          logs = json.loads(req('resources/read', {'uri': 'godot://runtime/logs'}, 5)['result']['contents'][0]['text'])
          assert logs['execution_mode'] == 'offline_fallback'
          assert isinstance(logs['records'], list)

          proc.stdin.close()
          proc.wait()
          print("Fast CI MCP verification complete")
          EOF

  # The live release gate the guides describe. Without this, Phase 4 search,
  # reimport, capture and diff, and every editor UndoRedo path, could break
  # without any job going red: didi_tests cannot reach code that needs a running
  # engine. Windows first because the harness is PowerShell; a POSIX harness is
  # still owed.
  #
  # Prose cannot change what a running editor does, so this only runs when the
  # change reaches code, fixtures, or this workflow.
  godot-integration:
    name: Live Godot Integration (windows, ${{ matrix.godot-version }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.5.1, 4.7.2]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-bin
          key: godot-${{ matrix.godot-version }}-stable-win64

      - name: Download Godot ${{ matrix.godot-version }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        env:
          GODOT_VERSION: ${{ matrix.godot-version }}
        run: |
          set -euo pipefail
          mkdir -p godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          curl --fail --location --retry 3 --retry-delay 5 --output godot.zip "$url"
          7z x godot.zip -ogodot-bin
          ls godot-bin

      - name: Configure and Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Run Live Godot Integration Harness
        shell: pwsh
        env:
          GODOT_VERSION: ${{ matrix.godot-version }}
        run: |
          $godot = Get-ChildItem -Path godot-bin -Filter "Godot_v${env:GODOT_VERSION}-stable_win64*.exe" |
                   Where-Object { $_.Name -notlike "*console*" } |
                   Select-Object -First 1
          if (-not $godot) { throw "Godot executable not found under godot-bin" }
          ./tests/run_godot_integration.ps1 -GodotExecutable $godot.FullName

      - name: Verify Managed Editor Crash Recovery
        shell: pwsh
        env:
          GODOT_VERSION: ${{ matrix.godot-version }}
        run: |
          $godot = Get-ChildItem -Path godot-bin -Filter "Godot_v${env:GODOT_VERSION}-stable_win64*.exe" |
                   Where-Object { $_.Name -notlike "*console*" } | Select-Object -First 1
          if (-not $godot) { throw "Godot executable not found under godot-bin" }
          $env:DIDI_TEST_BINARY = (Resolve-Path build/Release/didi.exe).Path
          $env:DIDI_RECOVERY_GODOT = $godot.FullName
          $env:DIDI_RECOVERY_ARTIFACT_DIR = Join-Path $PWD 'build/recovery-artifacts'
          $env:PYTHONPATH = Join-Path $PWD 'tests'
          python -m unittest tests.test_managed_recovery_live tests.test_managed_recovery_adversarial -v

      # Evidence from a crash that was retried past is worth keeping even when
      # the run then goes green: it is the only record of how often the engine
      # bug still fires.
      - name: Upload Engine Logs On Failure Or Retried Crash
        if: always() && (failure() || hashFiles('build/godot_engine_worker_crash_attempt*.log') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-integration-${{ matrix.godot-version }}-logs
          path: |
            build/godot_*.log
            build/godot_*.out
            build/godot_*.err
            build/godot_*.dmp
            build/recovery-artifacts/
          if-no-files-found: ignore

  # The option landed with #38; this is the job that uses it. ASan and UBSan see
  # things the plain builds cannot, and every one of these tests exercises real
  # allocation and lifetime paths.
  sanitizers:
    name: Sanitizers (ubuntu, asan+ubsan)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build build-essential

      - name: Configure With Sanitizers
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDIDI_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Native Tests Under Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/didi_tests

  # The single required status check. Skipped jobs report no result at all, so
  # a branch rule that named the matrix directly would block every docs-only
  # pull request forever. This job always runs, and fails only when something
  # that did run came back red.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [ changes, fast-build-and-test, godot-integration, sanitizers ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the aggregate result
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          width = max(len(name) for name in results)
          bad = []
          for name, data in sorted(results.items()):
              outcome = data.get("result", "unknown")
              print(f"{name.ljust(width)}  {outcome}")
              if outcome in ("failure", "cancelled"):
                  bad.append(name)
          if bad:
              print(f"\nRed: {', '.join(bad)}", file=sys.stderr)
              sys.exit(1)
          print("\nEvery job that ran was green.")
          EOF
