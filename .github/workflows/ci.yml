name: Didi Fast & Efficient CI

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'addons/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'addons/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Compiler Cache (ccache / sccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build build-essential

      - name: Install Build Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (POSIX Ninja)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile Targets in Parallel
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/didi_tests.exe
          else
            ./build/didi_tests
          fi

      - name: Run End-to-End MCP Integration Test
        shell: bash
        run: |
          python3 - << 'EOF' || python - << 'EOF'
          import subprocess
          import json
          import os

          exe = './build/Release/didi.exe' if os.name == 'nt' else './build/didi'
          proc = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          def req(method, params, i):
              proc.stdin.write(json.dumps({'jsonrpc': '2.0', 'id': i, 'method': method, 'params': params}) + '\n')
              proc.stdin.flush()
              return json.loads(proc.stdout.readline())

          assert req('initialize', {'protocolVersion': '2024-11-05'}, 1)['result']['serverInfo']['name'] == 'didi'
          tools = req('tools/list', {}, 2)['result']['tools']
          by_name = {tool['name']: tool for tool in tools}
          assert len(tools) == 50
          assert by_name['scene_get_hierarchy']['_meta']['didi']['implemented'] is True
          assert by_name['signal_connect']['_meta']['didi']['implemented'] is False

          project = json.loads(req('resources/read', {'uri': 'godot://project/tree'}, 3)['result']['contents'][0]['text'])
          assert project['execution_mode'] == 'offline_fallback'
          assert project['total_resources'] > 0

          hierarchy = json.loads(req('tools/call', {
              'name': 'get_scene_hierarchy',
              'arguments': {'root_path': 'res://scenes/main.tscn'}
          }, 4)['result']['content'][0]['text'])
          assert hierarchy['execution_mode'] == 'offline_fallback'
          assert hierarchy['scene_tree']['path'].startswith('/root/')
          assert len(hierarchy['scene_tree']['children']) >= 1

          proc.stdin.close()
          proc.wait()
          print("✓ Fast CI MCP Verification Complete")
          EOF
