name: Fast Lint & Docs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/lint.yml'
      - '.github/workflows/release.yml'
      - 'tools/validate_documentation.py'
      - 'tests/test_documentation_validator.py'
      - 'CMakeLists.txt'
      - 'include/didi/mcp/mcp_protocol.hpp'
      - 'src/standalone/main.cpp'
      - 'src/mcp/tool_registry.cpp'
      - 'addons/didi/**'
      - 'demo/addons/didi/**'
      - 'tests/test_editor_console.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/lint.yml'
      - '.github/workflows/release.yml'
      - 'tools/validate_documentation.py'
      - 'tests/test_documentation_validator.py'
      - 'CMakeLists.txt'
      - 'include/didi/mcp/mcp_protocol.hpp'
      - 'src/standalone/main.cpp'
      - 'src/mcp/tool_registry.cpp'
      - 'addons/didi/**'
      - 'demo/addons/didi/**'
      - 'tests/test_editor_console.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-docs-check:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shallow
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate Documentation Contract
        run: |
          python -m unittest tests.test_documentation_validator -v
          python -m unittest tests.test_field_trial -v
          python -m unittest tests.test_editor_console -v
          python tools/validate_documentation.py
