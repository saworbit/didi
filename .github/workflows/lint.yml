name: Fast Lint & Docs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-docs-check:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shallow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Documentation Files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f docs/ARCHITECTURE.md
          test -f docs/TOOL_REFERENCE.md
          test -f docs/QUICKSTART.md
          test -f docs/LLM_INSTRUCTIONS.md
          test -f docs/ADMIN_GUIDE.md
          echo "All critical documentation files verified."
