name: Supply Chain

# Two questions about everything this repository trusts:
#   - Scorecard: how does this project score against the OpenSSF checks for
#     branch protection, token permissions, pinned dependencies and dangerous
#     workflow patterns? Results land in the Security tab and behind the badge
#     in the README, so the answer is public rather than assumed.
#   - Dependency review: does this pull request introduce a dependency with a
#     known vulnerability or an incompatible licence? The only package
#     ecosystem here is GitHub Actions, which is also the one with write access
#     to the repository.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Scorecard's Branch-Protection check reruns when the rules change.
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload the SARIF to the code-scanning dashboard.
      security-events: write
      # Publish to the OpenSSF API so the README badge can resolve.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard Analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository: publishing is what lets the badge and the
          # OpenSSF API report a score at all.
          publish_results: true

      - name: Upload Scorecard Results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review Dependency Changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # This project ships under MIT and vendors only permissive
          # single-header libraries (see THIRD_PARTY.md). A copyleft dependency
          # arriving by accident is a licence decision, not a build detail, so
          # it stops here and gets made deliberately.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  # The third question, and the one no off-the-shelf tool answers here: are the
  # vendored single-header libraries in `include/` still current? They are
  # copied files with no manifest, so Dependabot cannot see them and neither can
  # a lockfile scanner. THIRD_PARTY.md used to end by admitting they were
  # "reviewed by hand or not at all"; this is the hand, automated.
  #
  # Weekly rather than per-pull-request, and issue-opening rather than
  # check-failing, because upstream shipping a release is news about the world
  # and not a defect in the branch that happens to be open. The offline half of
  # the same tool -- does THIRD_PARTY.md still describe the files on disk? --
  # runs in the docs suite on every pull request, where it belongs, because that
  # question is about the branch and needs no network.
  vendored-sources:
    name: Vendored Sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Vendored Versions
        id: check
        env:
          # Lifts the GitHub API rate limit from per-IP to per-token. A shared
          # runner's 60 an hour may already be spent by somebody else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if python tools/check_vendored_versions.py --check > report.txt 2>&1; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          fi
          cat report.txt

      - name: Open Or Update The Tracking Issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Vendored sources are behind upstream'
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "A vendored source in \`include/\` no longer matches upstream."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Updating one of these is not a routine bump -- [THIRD_PARTY.md](../blob/main/THIRD_PARTY.md)"
            echo "says what each change involves. \`json.hpp\` parses every request that"
            echo "arrives from an MCP client, so a change to it is a change on the"
            echo "untrusted input path."
            echo
            echo "Raised by [Supply Chain]($RUN_URL). This issue is reused rather than"
            echo "reopened weekly; it closes when the tree catches up."
          } > body.md

          # One issue, refreshed, rather than a new one every Tuesday. Matched on
          # the exact title this step writes, among the open issues carrying the
          # label it applies, so a human retitling it starts a fresh one rather
          # than silently losing the next report.
          existing=$(gh issue list --repo "$REPO" --state open --label dependencies \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
            echo "Refreshed issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label dependencies --label tooling --body-file body.md
          fi

  # The fourth question: is anything open in the code scanning tab? Every job
  # that touches code scanning writes to it and none read it back, so on
  # 2026-09-20 seven alerts had been open for up to eleven days with nobody told
  # (#807). Two were CodeQL findings dismissed a week earlier and raised again
  # under new numbers when the code around them moved, which recurs by design.
  # Same shape as the vendored check above: weekly, one tracking issue, and
  # never a failed check on somebody's pull request.
  code-scanning-alerts:
    name: Code Scanning Alerts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read Open Alerts
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python tools/check_code_scanning.py --check > report.txt || status=$?
          cat report.txt
          # 2 means the tab could not be read. That fails this job rather than
          # reading as a clean week.
          case "$status" in
            0) echo 'open=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'open=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Open Or Update The Tracking Issue
        if: steps.check.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Code scanning alerts are open'
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The code scanning tab has alerts open."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Each one needs a fix or a written disposition in"
            echo "[SECURITY.md](../blob/main/SECURITY.md)."
            echo
            echo "Raised by [Supply Chain]($RUN_URL). This issue is reused rather than"
            echo "reopened weekly, and the same job closes it once the tab is empty."
          } > body.md

          # Matched on the exact title, as the vendored check does, so a person
          # retitling it starts a fresh one rather than losing the next report.
          existing=$(gh issue list --repo "$REPO" --state open --label security \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
            echo "Refreshed issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label security --label ci --body-file body.md
          fi

      - name: Close The Tracking Issue
        if: steps.check.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Code scanning alerts are open'
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open --label security \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "No code scanning alerts are open as of [this run]($RUN_URL)."
          fi
