name: GitHub Pages

# Builds the project site from site/ and docs/brand/ and publishes it at
# https://saworbit.github.io/didi/. The build runs on every pull request, so a
# broken template or a missing asset goes red there rather than on main; only
# a push to main deploys. Pages is configured to deploy from this workflow, so
# no branch carries generated HTML and nothing is served that was not built
# from a commit on main.
#
# No path filter, deliberately. The site reads the version and the surface
# counts out of CMakeLists.txt and README.md, so a change to either has to
# rebuild it, and the build is a few seconds of Python either way.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The build verifies its own output: every relative src and href on
      # every page must name a file it wrote, and no placeholder may survive.
      - name: Build the site
        run: python site/build.py --out _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy Site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment that is already under way finishes; the next one queues
    # behind it rather than cancelling it half-published.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
