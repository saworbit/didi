name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-packages:
    name: Package Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: didi-windows-x64
            archive_ext: zip
          - os: ubuntu-22.04
            artifact_name: didi-linux-x64
            archive_ext: tar.gz
          - os: macos-14
            artifact_name: didi-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CMake
        if: runner.os != 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Binaries
        run: cmake --build build --config Release --parallel

      - name: Package Binary & Addons (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin
          mkdir -p dist/${{ matrix.artifact_name }}/addons/didi
          cp build/Release/didi.exe dist/${{ matrix.artifact_name }}/bin/
          cp -r addons/didi/* dist/${{ matrix.artifact_name }}/addons/didi/
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/
          cd dist
          7z a ../${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}/

      - name: Package Binary & Addons (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin
          mkdir -p dist/${{ matrix.artifact_name }}/addons/didi
          cp build/didi dist/${{ matrix.artifact_name }}/bin/
          cp -r addons/didi/* dist/${{ matrix.artifact_name }}/addons/didi/
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}/

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
