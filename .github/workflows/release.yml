name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-packages:
    name: Package Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: didi-windows-x64
            archive_ext: zip
          - os: ubuntu-22.04
            artifact_name: didi-linux-x64
            archive_ext: tar.gz
          # arm64 only. macos-14 is an Apple Silicon runner and this builds for
          # its own architecture, so there is no Intel macOS artifact. An Intel
          # or universal build needs a second runner or an explicit
          # CMAKE_OSX_ARCHITECTURES, which is a packaging decision rather than a
          # build fix; the artifact name says arm64 so nobody is misled.
          - os: macos-14
            artifact_name: didi-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup CMake
        if: runner.os != 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      # ctest runs the Python contract suite as well as the native one, and that
      # suite needs the pinned jsonschema. Without this the release gate fails on
      # a runner whose system jsonschema is older than Draft202012Validator,
      # which is exactly how a release stops on a dependency and not on a defect.
      # CMake is told which interpreter to bake into the test, so ctest uses this
      # one rather than whichever it would have discovered.
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-release
          VENV_PY=".venv-release/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY=".venv-release/Scripts/python.exe"
          "$VENV_PY" -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          "$VENV_PY" -c "import jsonschema; assert jsonschema.__version__ == '4.25.1', jsonschema.__version__"
          # This step runs in bash, so $PWD on Windows is a /d/a/... path that
          # CMake cannot execute. cygpath -m gives an absolute Windows path with
          # forward slashes, which is the form CMake wants on every runner.
          if [ "$RUNNER_OS" = "Windows" ]; then
            RESOLVED=$(cygpath -m "$PWD/$VENV_PY")
          else
            RESOLVED="$PWD/$VENV_PY"
          fi
          echo "DIDI_RELEASE_PYTHON=$RESOLVED" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="${{ env.DIDI_RELEASE_PYTHON }}"

      - name: Build Release Binaries
        run: cmake --build build --config Release --parallel

      # A tag used to package binaries without running anything. A broken build
      # could ship as a GitHub Release with nothing in the way of it.
      - name: Run Tests Before Packaging
        run: ctest --test-dir build -C Release --output-on-failure

      - name: MCP Stdio Smoke Before Packaging
        shell: bash
        run: |
          set -euo pipefail
          exe=./build/didi
          [ -x "$exe" ] || exe=./build/Release/didi.exe
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          } | "$exe" --project tests/godot_smoke > smoke.out
          grep -q '"serverInfo"' smoke.out
          grep -q '"tools"' smoke.out
          echo "Packaging smoke passed"

      - name: Package Binary & Addons (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin
          mkdir -p dist/${{ matrix.artifact_name }}/addons/didi
          cp build/Release/didi.exe dist/${{ matrix.artifact_name }}/bin/
          cp build/Release/didi_class_reference.json dist/${{ matrix.artifact_name }}/bin/
          # From the staged addon the build produced, not from the source
          # directory, which also holds whatever a tool generated in place.
          cp -r build/addons/didi/* dist/${{ matrix.artifact_name }}/addons/didi/
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/
          cd dist
          7z a ../${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}/

      - name: Package Binary & Addons (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin
          mkdir -p dist/${{ matrix.artifact_name }}/addons/didi
          cp build/didi dist/${{ matrix.artifact_name }}/bin/
          cp build/didi_class_reference.json dist/${{ matrix.artifact_name }}/bin/
          cp -r build/addons/didi/* dist/${{ matrix.artifact_name }}/addons/didi/
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}/

      - name: Upload Release Archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
