name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default. Only the publishing job asks for `contents: write`, so
# a compromised build step on any of the three runners cannot push a tag, a
# commit or a release of its own.
permissions:
  contents: read

# A tag is published once. Two runs of the same tag racing each other would
# upload assets twice, so the second waits rather than being cancelled: a
# half-published release is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-packages:
    name: Package Release (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    # Empty for the runners that build on the host. The Linux leg builds inside
    # a container instead; see the comment on its matrix entry.
    container: ${{ matrix.container }}
    # Ninety, measured rather than guessed. The macOS leg took fifty minutes on
    # the v1.6.0 release and is the slowest by a factor of five; a sixty-minute
    # cap left ten minutes of headroom and a dry run duly went over it and was
    # killed. The point of a timeout here is to stop a hung job burning the
    # six-hour default, not to be a second, tighter deadline nobody measured.
    # See #345: fifty minutes is itself the defect, and this number should come
    # down once that is fixed.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            container: ''
            artifact_name: didi-windows-x64
            archive_ext: zip

          # The Linux artifact is built inside Ubuntu 22.04 rather than on it.
          #
          # It used to run on the `ubuntu-22.04` runner image, chosen for glibc:
          # a binary built against 2.35 starts on Ubuntu 22.04 and Debian 12,
          # and one built on a newer host does not. That image is being retired
          # -- deprecation from 2026-09-17, unsupported from 2027-04-17 -- and
          # GitHub brownouts already kill jobs using the label to force the
          # issue. One killed a release rehearsal mid-compile.
          #
          # Moving the label to ubuntu-24.04 would have raised the floor to
          # glibc 2.39 and silently dropped every Ubuntu 22.04 LTS and Debian 12
          # user, which is a decision about who can run Didi rather than a CI
          # fix. A container keeps the floor exactly where it was and puts the
          # job on a supported runner. Pinned by digest because this build feeds
          # the provenance attestation below: what built the binary should be a
          # fact, not whatever the tag pointed at that day. `apt-get update`
          # still installs current packages on top.
          - os: ubuntu-latest
            container: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
            artifact_name: didi-linux-x64
            archive_ext: tar.gz

          # arm64 only. macos-14 is an Apple Silicon runner and this builds for
          # its own architecture, so there is no Intel macOS artifact. An Intel
          # or universal build needs a second runner or an explicit
          # CMAKE_OSX_ARCHITECTURES, which is a packaging decision rather than a
          # build fix; the artifact name says arm64 so nobody is misled.
          - os: macos-14
            container: ''
            artifact_name: didi-macos-arm64
            archive_ext: tar.gz

    steps:
      # First, because checkout wants git and everything after wants a
      # compiler. The base image has neither. CMake is deliberately not
      # installed here: the pinned 3.28 step below supplies it on every POSIX
      # leg, so containerising changed where the Linux build runs and nothing
      # about which toolchain builds it.
      #
      # python-is-python3 is not decoration. The runner image ships a `python`
      # on PATH; a bare Ubuntu container ships only `python3`. The release gate
      # runs the whole Python suite through ctest, and one case resolves an
      # executable named `python` -- it failed here on the first attempt, which
      # is the sort of thing a release rehearsal exists to find.
      - name: Prepare the build container
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            ninja-build python3 python3-venv python3-pip python-is-python3
          # The container runs as root against a workspace it does not own, so
          # git refuses to touch it without this.
          git config --global --add safe.directory '*'
          echo "Container: $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "glibc: $(ldd --version | head -1)"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is compiled, because the macOS leg takes most of an
      # hour and a tag that names the wrong version should fail in seconds.
      # Pushing v2.1.0 over a tree that still says 2.0.0 would otherwise build,
      # test, sign and publish binaries whose --version, plugin.cfg and build id
      # all say 2.0.0 under a release called v2.1.0. The documentation
      # validator already holds the version files to each other; this holds the
      # tag to them. A rehearsal runs from a branch, so it only reports.
      - name: Check the tag names the version being built
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^project(didi VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt)"
          if [ -z "${version}" ]; then
            echo "CMakeLists.txt no longer declares project(didi VERSION x.y.z)" >&2
            exit 1
          fi
          echo "DIDI_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Building Didi ${version} from ${GITHUB_REF}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            status=0
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}" >&2
              status=1
            fi
            if ! grep -qF "version=\"${version}\"" addons/didi/plugin.cfg; then
              echo "addons/didi/plugin.cfg does not say version=\"${version}\"" >&2
              status=1
            fi
            if ! grep -q "^## \[${version//./\\.}\] - " CHANGELOG.md; then
              echo "CHANGELOG.md has no '## [${version}] - <date>' section" >&2
              status=1
            fi
            exit "${status}"
          fi

      - name: Setup CMake
        if: runner.os != 'Windows'
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '3.28.x'

      # The Linux container gets ninja from apt above; macOS builds on the host
      # and has none by default.
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ctest runs the Python contract suite as well as the native one, and that
      # suite needs the pinned jsonschema. Without this the release gate fails on
      # a runner whose system jsonschema is older than Draft202012Validator,
      # which is exactly how a release stops on a dependency and not on a defect.
      # CMake is told which interpreter to bake into the test, so ctest uses this
      # one rather than whichever it would have discovered.
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-release
          VENV_PY=".venv-release/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY=".venv-release/Scripts/python.exe"
          "$VENV_PY" -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          # Read from requirements-dev.txt, not repeated here. See the same
          # step in ci.yml for why the duplicated literal had to go.
          "$VENV_PY" - << 'EOF'
          import pathlib
          import re
          import sys

          from importlib.metadata import version

          # importlib.metadata rather than jsonschema.__version__. The
          # attribute is deprecated as of 4.26.0 and its own warning says it
          # will be removed, at which point this check would raise
          # AttributeError and take the release gate down with it. The
          # deprecation surfaced on the 4.26.0 bump, before it could bite.
          installed = version('jsonschema')

          pin = re.search(r'^jsonschema==([^\s#]+)', pathlib.Path('requirements-dev.txt').read_text(encoding='utf-8'), re.M)
          if pin is None:
              sys.exit('requirements-dev.txt no longer pins an exact jsonschema version')
          if installed != pin.group(1):
              sys.exit(f'installed jsonschema {installed}, pinned {pin.group(1)}')
          print(f'jsonschema {installed} matches the pin')
          EOF
          # This step runs in bash, so $PWD on Windows is a /d/a/... path that
          # CMake cannot execute. cygpath -m gives an absolute Windows path with
          # forward slashes, which is the form CMake wants on every runner.
          if [ "$RUNNER_OS" = "Windows" ]; then
            RESOLVED=$(cygpath -m "$PWD/$VENV_PY")
          else
            RESOLVED="$PWD/$VENV_PY"
          fi
          echo "DIDI_RELEASE_PYTHON=$RESOLVED" >> "$GITHUB_ENV"

      # Two steps rather than one with a conditional generator argument,
      # because macOS runners still ship bash 3.2 and expanding an empty array
      # under `set -u` there is an error rather than nothing. ci.yml splits the
      # same way.
      #
      # The interpreter path is read out of the environment rather than
      # interpolated into the command line: a `${{ }}` expansion is textual
      # substitution into the shell before it runs, which is the shape a
      # workflow injection takes even when today's value is a path this
      # workflow computed itself.
      #
      # The C++ runtime goes in statically on Windows, for the reason it does on
      # Linux below: the binaries imported MSVCP140.dll and VCRUNTIME140.dll,
      # which Windows does not ship, so a machine without the Visual C++
      # Redistributable could not start didi.exe and Godot could not load the
      # extension. A machine with an older redistributable is worse off than
      # one with none: binaries built by a current toolset crash in std::mutex
      # against a runtime older than 14.40, and nothing in the error says why.
      # Godot's own Windows builds link the runtime statically for the same
      # reason. The Debug half of the expression is for completeness; this job
      # only builds Release.
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_RUNTIME_LIBRARY='MultiThreaded$<$<CONFIG:Debug>:Debug>' \
            -DPython3_EXECUTABLE="$DIDI_RELEASE_PYTHON"

      # Ninja, matching ci.yml. This job used the default generator and took
      # fifty minutes on macOS against ten on Linux and seven on Windows, for
      # the same code -- close enough to the timeout that a release was one
      # slow day from failing. Deliberately no ccache: a release should be
      # built from clean, and the generator was the difference that mattered.
      - name: Configure CMake (POSIX Ninja)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The C++ runtime goes in statically on Linux.
          #
          # The container above keeps the glibc floor at 2.34, which is what the
          # matrix comment is about. It is not the floor that binds: the binary
          # also linked libstdc++ dynamically, and Ubuntu 22.04's libstdc++ is
          # GCC 12's, which needs GLIBCXX_3.4.30. Rocky, RHEL and AlmaLinux 9
          # have glibc 2.34 -- exactly the floor the container was chosen to
          # hold -- and libstdc++ from GCC 11, one release short, so neither
          # bin/didi nor the addon's .so would start there. libstdc++ was the
          # binding constraint and nothing had picked it (#647).
          #
          # Godot's own Linux builds do this for the same reason. It costs about
          # a megabyte. Both flags, and both linker variables, because the
          # archive ships an executable and a shared library and a user runs
          # both.
          RUNTIME_LINK_FLAGS=""
          if [ "${RUNNER_OS}" = "Linux" ]; then
            RUNTIME_LINK_FLAGS="-static-libstdc++ -static-libgcc"
          fi
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="${RUNTIME_LINK_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${RUNTIME_LINK_FLAGS}" \
            -DPython3_EXECUTABLE="$DIDI_RELEASE_PYTHON"

      - name: Build Release Binaries
        run: cmake --build build --config Release --parallel

      # The check that would have caught #647, run on what was just built
      # rather than on what a distro happens to have. A release that cannot
      # start on a distro whose glibc meets the stated floor is the failure
      # this exists to stop, and the archive's two halves -- the server the
      # user runs and the library they drop into a project -- are both checked.
      - name: Verify the Linux binaries stay on the stated floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 2.34 is Rocky, RHEL and AlmaLinux 9, and the oldest thing the
          # release claims. Raising it is a decision about who can run Didi,
          # so it is written here once and compared against, not inferred.
          FLOOR="2.34"
          status=0
          for binary in build/didi build/addons/didi/bin/libdidi_extension.so; do
            if [ ! -f "${binary}" ]; then
              echo "missing: ${binary}"
              status=1
              continue
            fi
            # A dynamically linked libstdc++ is what broke this. Statically
            # linked, the binary needs no GLIBCXX_ symbol version at all.
            cxx="$(readelf -V "${binary}" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV || true)"
            if [ -n "${cxx}" ]; then
              echo "${binary} needs libstdc++ symbol versions, so it is not statically linked:"
              echo "${cxx}"
              status=1
            fi
            worst="$(readelf -V "${binary}" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)"
            if [ -n "${worst}" ] && [ "$(printf '%s\n%s\n' "${FLOOR}" "${worst}" | sort -V | tail -1)" != "${FLOOR}" ]; then
              echo "${binary} needs glibc ${worst}, above the stated floor of ${FLOOR}"
              status=1
            fi
            echo "${binary}: glibc <= ${worst:-none}, no libstdc++ symbol versions"
          done
          exit "${status}"

      # A tag used to package binaries without running anything. A broken build
      # could ship as a GitHub Release with nothing in the way of it.
      - name: Run Tests Before Packaging
        run: ctest --test-dir build -C Release --output-on-failure

      # One staging step for all three platforms, so the archives cannot drift
      # apart the way two copies of the same commands can.
      #
      # The README is not the repository's. That one is written for someone
      # browsing the source: its images and most of its links are relative
      # paths into a tree the archive does not contain, and it explains how to
      # build what the archive already holds. packaging/README.md.in is written
      # for someone who has only the download, and is filled in for this
      # platform. THIRD_PARTY_NOTICES.txt is there because the MIT licenses of
      # the vendored code in include/ ask for their notices to travel with every
      # copy, and the binaries are copies.
      - name: Stage the archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.artifact_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows)
              built=build/Release; exe=didi.exe; library=didi_extension.dll
              platform=windows; platform_name="Windows (x64)"
              example_command="C:/Tools/${ARCHIVE}/bin/didi.exe"
              example_project="C:/Projects/my_game" ;;
            Linux)
              built=build; exe=didi; library=libdidi_extension.so
              platform=linux; platform_name="Linux (x64)"
              example_command="/home/you/tools/${ARCHIVE}/bin/didi"
              example_project="/home/you/projects/my_game" ;;
            macOS)
              built=build; exe=didi; library=libdidi_extension.dylib
              platform=macos; platform_name="macOS (Apple silicon)"
              example_command="/Users/you/Tools/${ARCHIVE}/bin/didi"
              example_project="/Users/you/Projects/my_game" ;;
            *)
              echo "No packaging rule for ${RUNNER_OS}" >&2
              exit 1 ;;
          esac
          {
            echo "DIDI_EXE=${exe}"
            echo "DIDI_LIBRARY=${library}"
          } >> "$GITHUB_ENV"

          stage="dist/${ARCHIVE}"
          rm -rf dist
          mkdir -p "${stage}/bin" "${stage}/addons"
          cp "${built}/${exe}" "${built}/didi_class_reference.json" "${stage}/bin/"
          # From the addon the build assembled, not from the source directory,
          # which also holds whatever a tool generated in place.
          cp -R build/addons/didi "${stage}/addons/"
          cp LICENSE packaging/THIRD_PARTY_NOTICES.txt "${stage}/"

          # This platform's blocks only, then the placeholders. Carriage
          # returns go first: the Windows checkout converts line endings, and a
          # marker line ending in \r would match nothing and ship every
          # platform's instructions in every archive.
          tr -d '\r' < packaging/README.md.in \
            | awk -v keep="${platform}" '
                /^<!-- platform:[a-z]+ -->$/ { block = $0; sub(/^<!-- platform:/, "", block); sub(/ -->$/, "", block); next }
                /^<!-- \/platform:[a-z]+ -->$/ { block = ""; next }
                block == "" || block == keep { print }
              ' \
            | sed -e "s|@VERSION@|${DIDI_VERSION}|g" \
                  -e "s|@PLATFORM_NAME@|${platform_name}|g" \
                  -e "s|@EXE@|${exe}|g" \
                  -e "s|@LIBRARY@|${library}|g" \
                  -e "s|@ARCHIVE_FILE@|${ARCHIVE}.${ARCHIVE_EXT}|g" \
                  -e "s|@EXAMPLE_COMMAND@|${example_command}|g" \
                  -e "s|@EXAMPLE_PROJECT@|${example_project}|g" \
            > "${stage}/README.md"

      # What a user unpacks, checked as a user would find it. Every check runs
      # and reports before the step fails, so one red run names every problem
      # rather than the first.
      - name: Check the archive holds exactly what it should
        shell: bash
        env:
          ARCHIVE: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          stage="dist/${ARCHIVE}"
          status=0

          # The tracked addon, the library the build made for it, the server
          # with its class reference, and three documents. Nothing else: not a
          # stray file a tool left in the build tree, and not the repository.
          expected="$(
            {
              git ls-files addons/didi
              printf '%s\n' "addons/didi/bin/${DIDI_LIBRARY}" \
                "bin/${DIDI_EXE}" bin/didi_class_reference.json \
                README.md LICENSE THIRD_PARTY_NOTICES.txt
            } | LC_ALL=C sort
          )"
          actual="$(cd "${stage}" && find . \( -type f -o -type l \) | sed 's|^\./||' | LC_ALL=C sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "The archive does not hold exactly what it should (< expected, > staged):" >&2
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") >&2 || true
            status=1
          fi
          while IFS= read -r file; do
            if [ ! -s "${stage}/${file}" ]; then
              echo "Empty file in the archive: ${file}" >&2
              status=1
            fi
          done <<< "${actual}"

          if grep -nE '@[A-Z_]+@|<!-- /?platform:' "${stage}/README.md" >&2; then
            echo "README.md still carries template markers" >&2
            status=1
          fi

          # The version a user sees has to be the version the release is
          # called, in both halves.
          reported="$("${stage}/bin/${DIDI_EXE}" --version | tr -d '\r' | head -1)"
          if [ "${reported}" != "didi (godot-mcp-native) v${DIDI_VERSION}" ]; then
            echo "The server reports '${reported}', not v${DIDI_VERSION}" >&2
            status=1
          fi
          if ! grep -qF "version=\"${DIDI_VERSION}\"" "${stage}/addons/didi/plugin.cfg"; then
            echo "The addon's plugin.cfg is not version ${DIDI_VERSION}" >&2
            status=1
          fi

          server="${stage}/bin/${DIDI_EXE}"
          library="${stage}/addons/didi/bin/${DIDI_LIBRARY}"
          case "${RUNNER_OS}" in
            Windows)
              # Neither binary may need the Visual C++ Redistributable. A check
              # that cannot find its tool fails rather than passing unread.
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              dumpbin="$("${vswhere}" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | tr -d '\r' | head -1)"
              if [ -z "${dumpbin}" ]; then
                echo "dumpbin.exe not found, so the runtime check cannot run" >&2
                exit 1
              fi
              for binary in "${server}" "${library}"; do
                imports="$("$(cygpath -u "${dumpbin}")" -nologo -dependents "$(cygpath -w "${binary}")" | tr -d '\r')"
                echo "${binary} imports:"
                printf '%s\n' "${imports}" | grep -iE '^[[:space:]]+[^[:space:]]+\.dll$' || true
                if printf '%s\n' "${imports}" | grep -qiE '^[[:space:]]+(msvcp|vcruntime|concrt)[0-9a-z_]*\.dll$'; then
                  echo "${binary} needs the Visual C++ Redistributable" >&2
                  status=1
                fi
              done
              ;;
            Linux)
              # Only libraries every glibc system has. The floor check above
              # covers their versions; this covers their names.
              for binary in "${server}" "${library}"; do
                needed="$(readelf -d "${binary}" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')"
                echo "${binary} needs: $(printf '%s' "${needed}" | tr '\n' ' ')"
                while IFS= read -r lib; do
                  case "${lib}" in
                    ''|libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|ld-linux-x86-64.so.2) ;;
                    *) echo "${binary} needs ${lib}, which is not part of glibc" >&2; status=1 ;;
                  esac
                done <<< "${needed}"
              done
              ;;
            macOS)
              # arm64 only, as the .gdextension declares; loading nothing from
              # outside the operating system; and a signature that is intact,
              # because Apple silicon will not run code without one.
              for binary in "${server}" "${library}"; do
                archs="$(lipo -archs "${binary}")"
                if [ "${archs}" != "arm64" ]; then
                  echo "${binary} is built for '${archs}', not arm64" >&2
                  status=1
                fi
                otool -L "${binary}"
                if otool -L "${binary}" | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/Library/|@rpath/libdidi_extension\.dylib$)' >&2; then
                  echo "${binary} loads a library from outside the operating system" >&2
                  status=1
                fi
                if ! codesign --verify --verbose=2 "${binary}"; then
                  echo "${binary} does not carry a valid signature" >&2
                  status=1
                fi
              done
              ;;
          esac
          exit "${status}"

      # Against the staged server rather than the build tree, so what passes is
      # what ships.
      - name: MCP Stdio Smoke Before Packaging
        shell: bash
        env:
          ARCHIVE: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          exe="dist/${ARCHIVE}/bin/${DIDI_EXE}"
          {
            # protocolVersion is a required string in InitializeRequest and is
            # refused when it is missing (#531). This smoke sent no params at
            # all, which was accepted until 2.0.0 and then failed the whole
            # release on a handshake the server was right to reject.
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          } | "$exe" --project tests/godot_smoke > smoke.out
          grep -q '"serverInfo"' smoke.out
          grep -q '"tools"' smoke.out
          # The handshake has to be answered, not merely survived. Without this
          # the grep above passes on the tools/list line alone, so a refused
          # initialize would package a release that no client can open.
          grep -q '"protocolVersion":"2024-11-05"' smoke.out
          echo "Packaging smoke passed"

      # Unpacked again and compared byte for byte with what was staged, so the
      # archiver cannot drop, rename or alter a file on the way in.
      - name: Create the archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          rm -rf reopened
          mkdir reopened
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "../${ARCHIVE}.zip" "${ARCHIVE}/" > /dev/null
            7z l "../${ARCHIVE}.zip"
            7z x -o../reopened "../${ARCHIVE}.zip" > /dev/null
          else
            tar -czf "../${ARCHIVE}.tar.gz" "${ARCHIVE}/"
            tar -tzvf "../${ARCHIVE}.tar.gz"
            tar -xzf "../${ARCHIVE}.tar.gz" -C ../reopened
          fi
          diff -r "${ARCHIVE}" "../reopened/${ARCHIVE}"
          echo "The archive reopens to exactly the staged tree"

      - name: Upload Release Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  # Signs and publishes. The job-level tag condition is gone on purpose: on a
  # manual run everything here happens except the publish, so the signing path
  # can be exercised without cutting a release. A release pipeline whose only
  # rehearsal is a real tag is a pipeline nobody rehearses.
  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Sigstore issues a short-lived signing certificate against this run's
      # OIDC identity. No key exists to be stolen, rotated, or left behind by a
      # maintainer, which is the whole reason to prefer it over a stored one.
      id-token: write
      # Records the attestation against the repository, so `gh attestation
      # verify` works without the bundle in hand.
      attestations: write
    steps:
      # CHANGELOG.md and nothing else, for the release notes. No code from the
      # repository runs in the one job that holds a write token.
      - name: Checkout the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Collect the archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # download-artifact nests each archive under its artifact name.
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec mv -t dist/ {} +
          if [ -z "$(ls -A dist)" ]; then
            echo "No archives were downloaded; refusing to sign or publish nothing." >&2
            exit 1
          fi
          ls -l dist

      - name: Write SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          # Plain checksums, for the reader who wants to confirm a download
          # matched without installing anything. The attestation below is the
          # part that says who built it; this only says the bytes are intact.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every published byte, SHA256SUMS included, so the checksum file
          # cannot be swapped independently of what it describes.
          subject-path: dist/*

      - name: Attach the provenance as a release asset
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub keeps the attestation, but only for people willing to call
          # its API. Shipping the bundle beside the archives lets anyone verify
          # offline, and it is the form OpenSSF Scorecard reads: the
          # Signed-Releases check inspects release assets and recognises
          # `*.intoto.jsonl`, not the attestation store.
          #
          # The ref is sanitised because it is only a tag on a tag run. On a
          # rehearsal it is the branch name, and branch names contain slashes:
          # `feat/signing` would make this a path into a directory that does
          # not exist, `cp` would fail, `set -e` would abort, and the rehearsal
          # would upload nothing at the exact moment it is meant to prove
          # itself. It did precisely that on the first branch to reach here.
          safe_ref="${TAG//[^A-Za-z0-9._-]/-}"
          cp "$BUNDLE" "dist/didi-${safe_ref}.intoto.jsonl"
          ls -l dist

      # The generated notes are a list of pull request titles, and for 2.0.0
      # that list put "Release 2.0.0" under Security and every fix under Tests,
      # with the Breaking section a reader most needed nowhere on the page. The
      # summary a person wrote for the version in CHANGELOG.md goes first. A
      # rehearsal has no tag, so it renders the newest released section to
      # show that the notes would come out.
      - name: Write the release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${TAG#v}"
          else
            version="$(sed -n 's/^## \[\([0-9][0-9.]*\)\] - .*/\1/p' CHANGELOG.md | head -1)"
          fi
          lead="$(awk -v head="## [${version}] - " '
              index($0, head) == 1 { on = 1; next }
              on && (/^### / || /^## /) { exit }
              on { print }
            ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$(printf '%s' "${lead}" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no summary under '## [${version}]' to lead the release notes" >&2
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/blob/v${version}"
          {
            printf '%s\n\n' "${lead}"
            printf 'Every change is listed in [CHANGELOG.md](%s/CHANGELOG.md). ' "${base}"
            printf 'Each archive holds a README with the install steps for its platform. '
            printf '%s and %s verify the downloads, ' "\`SHA256SUMS\`" "\`didi-v${version}.intoto.jsonl\`"
            printf 'as [SECURITY.md](%s/SECURITY.md#verifying-a-release) describes.\n' "${base}"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        # `gh` rather than a third-party action. This is the one job that holds
        # `contents: write`, and gh is already on the runner, so publishing
        # costs no additional trusted code. GitHub's generated notes, grouped
        # by the categories in .github/release.yml, follow the summary above.
        #
        # A draft, not a release. Everything is attached and attested, and
        # nothing is public until a person has downloaded the archives from
        # the draft, checked them, and published it with
        # `gh release edit <tag> --draft=false`. CONTRIBUTING.md has the steps.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were produced; refusing to publish an empty release." >&2
            exit 1
          fi
          printf 'Drafting %s with %d assets:\n' "$TAG" "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"
          gh release create "$TAG" --draft --title "$TAG" \
            --notes-file release-notes.md --generate-notes "${assets[@]}"

      - name: Upload the unpublished assets (manual run)
        # The rehearsal. A manual run produces and signs exactly what a tag
        # would, and leaves it as a workflow artifact instead of a release.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
