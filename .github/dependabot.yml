# The C++ sources vendor no package manager, so the moving parts Dependabot can
# actually see are the actions the workflows pin, the one Python package the
# contract suites need, and the base image the local CI lanes build on. Left
# alone, all three quietly rot: actions start warning about deprecated runner
# images, a pinned library stops receiving fixes, and a base image accumulates
# unpatched CVEs while the tag beside it still reads the same.
#
# Actions here are pinned to commit SHAs with a `# vX.Y.Z` comment beside each
# one, which `tools/validate_documentation.py` enforces. Dependabot understands
# that form and updates the SHA and the comment together, so pinning does not
# cost the automation it usually costs. The base image is pinned the same way,
# by digest, for the same reason.
#
# Every ecosystem below carries two groups rather than one. The first batches
# the routine version bumps; the second, `applies-to: security-updates`, exists
# so that a disclosure affecting several packages at once arrives as one pull
# request instead of six landing in the same minute. Security groups carry no
# `update-types` filter deliberately -- a fix is worth taking whether upstream
# shipped it as a patch or as a major.
#
# See THIRD_PARTY.md for what Dependabot cannot cover: the vendored
# single-header libraries in include/, which have no manifest to read.
# `tools/check_vendored_versions.py` watches those instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    # Wait a week before offering a brand-new release. A compromised publish is
    # usually caught and yanked within days, and this is the window in which an
    # automated bump would otherwise adopt it on the day it lands. Cooldown does
    # not apply to security updates, so a fix for a known CVE still arrives
    # immediately -- which is what makes the delay safe rather than merely slow.
    cooldown:
      default-days: 7
    groups:
      # One pull request for the routine bumps instead of six. A grouped update
      # either passes CI as a set or fails as a set, which is the same review
      # either way and a great deal less noise. Majors stay ungrouped: an action
      # that breaks its own interface deserves to be read on its own.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Version updates used to be switched off here because CI asserted an exact
  # jsonschema version in a second place, so any bump opened a pull request
  # that could only fail. Both workflows now read the pin out of
  # requirements-dev.txt, so a bump is a normal reviewable change: it either
  # passes the schema contract suites or it does not.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      dev-dependencies-security:
        applies-to: security-updates
        patterns:
          - '*'

  # `tools/localci/Dockerfile` is the image the local CI lanes and the dev
  # container both build from, which makes it the one place in this repository
  # where an unpatched Ubuntu can sit unnoticed. It is pinned by digest, so
  # Dependabot can offer the rebuilt image the way it offers a new action SHA.
  - package-ecosystem: docker
    directory: /tools/localci
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    # The release number is not Dependabot's to choose. `ubuntu:24.04` is there
    # because that is what `ubuntu-latest` resolved to on the GitHub runners, and
    # the lanes only stand in for CI while the two agree -- so the tag moves when
    # GitHub moves, checked by hand, not when Canonical publishes. Digest updates
    # are a different thing entirely: same release, same tag, rebuilt with the
    # current security patches, and those are exactly what should arrive weekly.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      base-image-security:
        applies-to: security-updates
        patterns:
          - '*'
