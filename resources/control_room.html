<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Didi Control Room</title>
<style>
/* Host variables are applied at runtime when the host supplies them. Every
   value below is a working fallback, so the page is correct with none of them. */
:root {
  color-scheme: light dark;

  --bg:        var(--color-background-primary, light-dark(#ffffff, #16181d));
  --bg-sunk:   var(--color-background-secondary, light-dark(#f6f7f9, #1c1f26));
  --bg-raised: var(--color-background-tertiary, light-dark(#ffffff, #21242c));
  --fg:        var(--color-text-primary, light-dark(#16181d, #e9ecf1));
  --fg-dim:    var(--color-text-secondary, light-dark(#5b6472, #99a2b0));
  --line:      var(--color-border-primary, light-dark(#e2e5ea, #2e3340));
  --accent:    var(--color-accent-primary, light-dark(#3d5afe, #7c8cff));

  --ok:    light-dark(#1a7f37, #3fb950);
  --warn:  light-dark(#9a6700, #d29922);
  --bad:   light-dark(#cf222e, #f85149);
  --ok-bg:   light-dark(#e8f5ec, #10281a);
  --warn-bg: light-dark(#fdf5e3, #2a2010);
  --bad-bg:  light-dark(#fdeceb, #2b1416);

  --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace);

  --r: 8px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---- header ---------------------------------------------------------- */

header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.mark { flex: 0 0 auto; }

.titles { flex: 1 1 auto; min-width: 0; }

h1 {
  font-size: 14px;
  font-weight: 650;
  margin: 0;
  letter-spacing: -0.01em;
}

.subtitle {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

button {
  font-family: inherit;
  font-size: 12px;
  color: var(--fg);
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---- status cards ---------------------------------------------------- */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}

.card {
  background: var(--bg-sunk);
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: var(--r);
  padding: 8px 10px;
  min-width: 0;
}
.card.ok   { border-left-color: var(--ok); }
.card.warn { border-left-color: var(--warn); }
.card.bad  { border-left-color: var(--bad); }
.card.unknown { border-left-color: var(--fg-dim); }

.card-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.lamp {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--fg-dim);
}
.ok   .lamp { background: var(--ok); }
.warn .lamp { background: var(--warn); }
.bad  .lamp { background: var(--bad); }

.card-label {
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
}

.card-value { font-size: 13px; font-weight: 600; }

/* A path has no spaces to wrap at, so it breaks anywhere. A sentence does,
   and breaking it anywhere splits words mid-syllable. */
.card-fact {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-dim);
  word-break: break-all;
  margin-top: 2px;
}

.card-reason {
  font-size: 11px;
  color: var(--fg-dim);
  margin-top: 3px;
}

/* ---- tabs ------------------------------------------------------------ */

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 10px;
}

.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 6px 10px;
  color: var(--fg-dim);
  font-weight: 550;
}
.tab:hover:not(:disabled) { color: var(--fg); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.count-pill {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-dim);
  margin-left: 4px;
}

/* ---- controls -------------------------------------------------------- */

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

input[type="search"] {
  font-family: inherit;
  font-size: 12px;
  color: var(--fg);
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 8px;
  min-width: 120px;
  flex: 1 1 140px;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--fg-dim);
  background: var(--bg-sunk);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px 3px 7px;
  cursor: pointer;
  user-select: none;
}
.toggle input { margin: 0; accent-color: var(--accent); }
.toggle:has(input:checked) { color: var(--fg); border-color: var(--accent); }

/* ---- tables ---------------------------------------------------------- */

.scroll { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }

table { width: 100%; border-collapse: collapse; font-size: 12px; }

th {
  position: sticky; top: 0;
  background: var(--bg-sunk);
  text-align: left;
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-dim);
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
}

td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.name { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }

.chip {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.chip.live          { color: var(--ok);   background: var(--ok-bg); }
.chip.offline_fallback,
.chip.local_session_management { color: var(--fg-dim); background: var(--bg-sunk); }
.chip.unavailable   { color: var(--warn); background: var(--warn-bg); }
.chip.unimplemented { color: var(--bad);  background: var(--bad-bg); }
.chip.mutates       { color: var(--warn); background: var(--warn-bg); }

/* ---- log ------------------------------------------------------------- */

.log { font-family: var(--mono); font-size: 11px; }
.log td { padding: 3px 8px; white-space: pre-wrap; word-break: break-word; }
.log .lvl { white-space: nowrap; font-weight: 650; }
.log .ERROR .lvl { color: var(--bad); }
.log .WARN  .lvl { color: var(--warn); }
.log .INFO  .lvl { color: var(--ok); }
.log .DEBUG .lvl { color: var(--fg-dim); }
.log .ts { color: var(--fg-dim); white-space: nowrap; }
.log .tag { color: var(--accent); white-space: nowrap; }

/* ---- misc ------------------------------------------------------------ */

.empty { padding: 20px 10px; text-align: center; color: var(--fg-dim); font-size: 12px; }

.note {
  font-size: 11px;
  color: var(--fg-dim);
  margin-top: 8px;
  padding-left: 8px;
  border-left: 2px solid var(--line);
}

.session-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); }
.session-row:last-child { border-bottom: none; }
.session-main { flex: 1 1 auto; min-width: 0; }
.session-id { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.session-meta { font-size: 10.5px; color: var(--fg-dim); }

.banner {
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid currentColor;
  border-radius: var(--r);
  padding: 6px 10px;
  font-size: 11.5px;
  margin-bottom: 10px;
}
.banner.bad { background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>

<header>
  <svg class="mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M11 8h4.5a8 8 0 0 1 0 16H11z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
  </svg>
  <div class="titles">
    <h1>Didi Control Room</h1>
    <div class="subtitle" id="project-root">no project reported</div>
  </div>
  <button id="refresh" class="primary" type="button">Refresh</button>
</header>

<div id="banner-slot"></div>

<div class="cards" id="cards"></div>

<div class="tabs" role="tablist" id="tabs"></div>

<div id="panel"></div>

<div class="note" id="footer-note"></div>

<script>
"use strict";
(function () {

  // --------------------------------------------------------------------
  // Bounds. The page renders what it is given, but never more than this.
  // --------------------------------------------------------------------
  var MAX_TOOL_ROWS = 400;
  var MAX_LOG_ROWS  = 500;
  var MAX_SESSIONS  = 50;
  var MAX_TEXT      = 400;

  // --------------------------------------------------------------------
  // postMessage JSON-RPC to the host.
  //
  // A sandboxed iframe has an opaque origin, so posting upward must use "*"
  // -- that is the specified pattern and it is why every inbound message is
  // checked against window.parent instead of against an origin string.
  // --------------------------------------------------------------------
  var nextId = 1;
  var pending = new Map();
  var initialized = false;

  function send(method, params) {
    var id = nextId++;
    var msg = { jsonrpc: "2.0", id: id, method: method, params: params || {} };
    return new Promise(function (resolve, reject) {
      pending.set(id, { resolve: resolve, reject: reject });
      window.parent.postMessage(msg, "*");
    });
  }

  function notify(method, params) {
    window.parent.postMessage(
      { jsonrpc: "2.0", method: method, params: params || {} }, "*");
  }

  function respond(id, result) {
    window.parent.postMessage({ jsonrpc: "2.0", id: id, result: result }, "*");
  }

  window.addEventListener("message", function (event) {
    // A4. Anything that is not the host is not the host.
    if (event.source !== window.parent) return;
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    if (msg.id !== undefined && msg.id !== null && msg.method === undefined) {
      var waiter = pending.get(msg.id);
      if (!waiter) return;
      pending.delete(msg.id);
      if (msg.error) waiter.reject(msg.error);
      else waiter.resolve(msg.result);
      return;
    }

    switch (msg.method) {
      case "ui/notifications/tool-result":
        adopt(msg.params);
        break;
      case "ui/notifications/host-context-changed":
        applyHostContext(msg.params);
        break;
      case "ui/notifications/tool-cancelled":
        setBusy(false);
        setBanner("The host cancelled that call.", "bad");
        break;
      case "ui/resource-teardown":
        if (msg.id !== undefined) respond(msg.id, {});
        break;
      default:
        break;
    }
  });

  // --------------------------------------------------------------------
  // Host context: variables the host gives us, applied as CSS custom
  // properties. Values are set through the CSSOM, never parsed as markup.
  // --------------------------------------------------------------------
  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== "object") return;
    var styles = ctx.styles;
    if (styles && styles.variables && typeof styles.variables === "object") {
      Object.keys(styles.variables).forEach(function (key) {
        if (key.indexOf("--") !== 0) return;
        var value = styles.variables[key];
        if (typeof value !== "string") return;
        document.documentElement.style.setProperty(key, value);
      });
    }
    if (styles && styles.css && typeof styles.css.fonts === "string") {
      var sheet = document.getElementById("host-fonts") || document.createElement("style");
      sheet.id = "host-fonts";
      sheet.textContent = styles.css.fonts;   // CSS text, not markup
      if (!sheet.parentNode) document.head.appendChild(sheet);
    }
    if (typeof ctx.theme === "string") {
      document.documentElement.style.setProperty("color-scheme", ctx.theme);
    }
  }

  // --------------------------------------------------------------------
  // DOM construction. A2: text only ever arrives through textContent, and
  // there is no path in this file from data to parsed markup.
  // --------------------------------------------------------------------
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = clip(String(text));
    return node;
  }

  function clip(text) {
    if (text.length <= MAX_TEXT) return text;
    // Never end on a high surrogate: half a pair renders as a replacement
    // character rather than as the character it came from.
    var cut = MAX_TEXT;
    var last = text.charCodeAt(cut - 1);
    if (last >= 0xD800 && last <= 0xDBFF) cut -= 1;
    return text.slice(0, cut) + "…";
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function str(value, fallback) {
    return typeof value === "string" && value.length ? value : (fallback || "");
  }

  function arr(value) {
    return Array.isArray(value) ? value : [];
  }

  // --------------------------------------------------------------------
  // State
  // --------------------------------------------------------------------
  var model = null;
  var activeTab = "overview";
  var busy = false;
  var filters = { query: "", liveOnly: false, mutationsOnly: false, problemsOnly: false };
  var logLevels = { ERROR: true, WARN: true, INFO: true, DEBUG: false };

  function adopt(params) {
    setBusy(false);
    if (!params || typeof params !== "object") return;
    var data = params.structuredContent;
    if (!data || typeof data !== "object") return;
    model = data;
    setBanner(null);
    render();
  }

  function setBusy(value) {
    busy = value;
    var button = document.getElementById("refresh");
    button.disabled = value;
    button.textContent = value ? "Refreshing…" : "Refresh";
  }

  function setBanner(text, kind) {
    var slot = document.getElementById("banner-slot");
    clear(slot);
    if (!text) return;
    slot.appendChild(el("div", kind === "bad" ? "banner bad" : "banner", text));
  }

  // --------------------------------------------------------------------
  // Calling tools. Every one of these is an existing Didi tool, routed
  // through the host, which applies its own consent policy.
  // --------------------------------------------------------------------
  function callTool(name, args) {
    setBusy(true);
    return send("tools/call", { name: name, arguments: args || {} })
      .then(function (result) {
        setBusy(false);
        if (result && result.isError) {
          setBanner(firstText(result) || (name + " returned an error."), "bad");
          return null;
        }
        return result;
      })
      .catch(function (error) {
        setBusy(false);
        setBanner(str(error && error.message, name + " could not be called."), "bad");
        return null;
      });
  }

  function firstText(result) {
    var content = arr(result && result.content);
    for (var i = 0; i < content.length; i++) {
      if (content[i] && content[i].type === "text" && typeof content[i].text === "string") {
        return content[i].text;
      }
    }
    return "";
  }

  // The result is visible to the model as well as to this page, so the log is
  // asked for in full only when a person has opened the page that shows it.
  function refresh(logLimit) {
    var args = {};
    if (typeof logLimit === "number") args.log_limit = logLimit;
    return callTool("didi_control_room", args).then(function (result) {
      if (result && result.structuredContent) {
        model = result.structuredContent;
        render();
      }
    });
  }

  // --------------------------------------------------------------------
  // Rendering
  // --------------------------------------------------------------------
  var TABS = [
    { id: "overview", label: "Overview" },
    { id: "tools",    label: "Tools" },
    { id: "sessions", label: "Sessions" },
    { id: "log",      label: "Log" }
  ];

  function render() {
    renderHeader();
    renderCards();
    renderTabs();
    renderPanel();
    reportSize();
  }

  function renderHeader() {
    var root = document.getElementById("project-root");
    var project = (model && model.project) || {};
    root.textContent = str(project.root, "no project reported");
    root.title = root.textContent;
  }

  function renderCards() {
    var host = document.getElementById("cards");
    clear(host);
    if (!model) return;
    arr(model.lights).slice(0, 8).forEach(function (light) {
      var state = str(light && light.state, "unknown");
      if (["ok", "warn", "bad", "unknown"].indexOf(state) === -1) state = "unknown";
      var card = el("div", "card " + state);
      var head = el("div", "card-head");
      head.appendChild(el("span", "lamp"));
      head.appendChild(el("span", "card-label", str(light.label, "—")));
      card.appendChild(head);
      card.appendChild(el("div", "card-value", str(light.value, "—")));
      if (light.fact) card.appendChild(el("div", "card-fact", light.fact));
      if (light.reason) card.appendChild(el("div", "card-reason", light.reason));
      host.appendChild(card);
    });
  }

  function renderTabs() {
    var host = document.getElementById("tabs");
    clear(host);
    TABS.forEach(function (tab) {
      var button = el("button", "tab", tab.label);
      button.type = "button";
      button.setAttribute("role", "tab");
      button.setAttribute("aria-selected", activeTab === tab.id ? "true" : "false");
      var count = tabCount(tab.id);
      if (count !== null) button.appendChild(el("span", "count-pill", String(count)));
      button.addEventListener("click", function () {
        activeTab = tab.id;
        renderTabs();
        renderPanel();
        reportSize();
        if (tab.id === "log" && model && model.log_truncated && !busy) {
          refresh(MAX_LOG_ROWS);
        }
      });
      host.appendChild(button);
    });
  }

  function tabCount(id) {
    if (!model) return null;
    if (id === "tools")    return arr(model.tools).length;
    if (id === "sessions") return arr(model.sessions).length;
    if (id === "log")      return arr(model.log).length;
    return null;
  }

  function renderPanel() {
    var host = document.getElementById("panel");
    clear(host);
    var note = document.getElementById("footer-note");
    clear(note);

    if (!model) {
      host.appendChild(el("div", "empty",
        "Waiting for Didi. Press Refresh to ask for the current state."));
      return;
    }

    if (activeTab === "overview") renderOverview(host, note);
    else if (activeTab === "tools") renderTools(host, note);
    else if (activeTab === "sessions") renderSessions(host, note);
    else renderLog(host, note);
  }

  // ---- overview --------------------------------------------------------

  function renderOverview(host, note) {
    var rows = arr(model.facts).slice(0, 60);
    if (!rows.length) {
      host.appendChild(el("div", "empty", "Didi reported no detail for this build."));
      return;
    }
    var wrap = el("div", "scroll");
    var table = el("table");
    var body = el("tbody");
    rows.forEach(function (fact) {
      var tr = el("tr");
      tr.appendChild(el("td", "name", str(fact && fact.label, "—")));
      tr.appendChild(el("td", null, str(fact && fact.value, "—")));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
    host.appendChild(wrap);
    note.textContent = str(model.captured_at, "");
  }

  // ---- tools -----------------------------------------------------------

  function renderTools(host, note) {
    var controls = el("div", "controls");

    var search = document.createElement("input");
    search.type = "search";
    search.placeholder = "Filter tools";
    search.value = filters.query;
    search.addEventListener("input", function () {
      filters.query = search.value;
      redrawToolTable();
    });
    controls.appendChild(search);

    controls.appendChild(toggle("Live now", "liveOnly"));
    controls.appendChild(toggle("Mutations", "mutationsOnly"));
    controls.appendChild(toggle("Problems", "problemsOnly"));
    host.appendChild(controls);

    var wrap = el("div", "scroll");
    wrap.id = "tool-table";
    host.appendChild(wrap);
    redrawToolTable();

    var surface = model.surface || {};
    note.textContent = [
      surface.canonical + " canonical",
      surface.implemented + " implemented",
      surface.unimplemented + " reserved",
      surface.legacy + " legacy"
    ].join(" · ");
  }

  function toggle(label, key) {
    var wrap = el("label", "toggle");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = filters[key];
    box.addEventListener("change", function () {
      filters[key] = box.checked;
      redrawToolTable();
    });
    wrap.appendChild(box);
    wrap.appendChild(el("span", null, label));
    return wrap;
  }

  function redrawToolTable() {
    var wrap = document.getElementById("tool-table");
    if (!wrap) return;
    clear(wrap);

    var query = filters.query.trim().toLowerCase();
    var rows = arr(model.tools).filter(function (tool) {
      var mode = str(tool.mode, "unknown");
      if (filters.liveOnly && mode !== "live") return false;
      if (filters.mutationsOnly && !tool.mutates) return false;
      if (filters.problemsOnly && mode !== "unavailable" && mode !== "unimplemented") return false;
      if (query && str(tool.name).toLowerCase().indexOf(query) === -1) return false;
      return true;
    }).slice(0, MAX_TOOL_ROWS);

    if (!rows.length) {
      wrap.appendChild(el("div", "empty", "No tool matches those filters."));
      return;
    }

    var table = el("table");
    var head = el("thead");
    var headRow = el("tr");
    ["Tool", "Mode", "Writes"].forEach(function (title) {
      headRow.appendChild(el("th", null, title));
    });
    head.appendChild(headRow);
    table.appendChild(head);

    var body = el("tbody");
    rows.forEach(function (tool) {
      var tr = el("tr");
      tr.appendChild(el("td", "name", str(tool.name, "—")));

      var modeCell = el("td");
      var mode = str(tool.mode, "unknown");
      modeCell.appendChild(el("span", "chip " + safeClass(mode), mode));
      tr.appendChild(modeCell);

      var writeCell = el("td");
      if (tool.mutates) writeCell.appendChild(el("span", "chip mutates", "mutates"));
      else writeCell.appendChild(el("span", null, "—"));
      tr.appendChild(writeCell);

      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
  }

  function safeClass(value) {
    return /^[a-z_]{1,32}$/.test(value) ? value : "unknown";
  }

  // ---- sessions --------------------------------------------------------

  function renderSessions(host, note) {
    var controls = el("div", "controls");
    var rescan = el("button", null, "Rescan sessions");
    rescan.type = "button";
    rescan.addEventListener("click", function () {
      callTool("runtime_list_sessions", {}).then(function (result) {
        if (result) refresh();
      });
    });
    controls.appendChild(rescan);

    var selected = model.selected_session;
    if (selected) {
      var detach = el("button", null, "Detach");
      detach.type = "button";
      detach.addEventListener("click", function () {
        callTool("runtime_detach_session", {}).then(function (result) {
          if (result) refresh();
        });
      });
      controls.appendChild(detach);
    }
    host.appendChild(controls);

    var sessions = arr(model.sessions).slice(0, MAX_SESSIONS);
    if (!sessions.length) {
      host.appendChild(el("div", "empty",
        "No published session. Start Godot with the Didi addon enabled, then rescan."));
      return;
    }

    var wrap = el("div", "scroll");
    sessions.forEach(function (session) {
      var row = el("div", "session-row");
      var main = el("div", "session-main");
      main.appendChild(el("div", "session-id", str(session.session_id, "—")));
      main.appendChild(el("div", "session-meta",
        [str(session.kind, "unknown kind"),
         "pid " + str(String(session.pid), "?"),
         str(session.project_path, "")].filter(Boolean).join("  ·  ")));
      row.appendChild(main);

      if (session.selected) {
        row.appendChild(el("span", "chip live", "selected"));
      } else {
        var attach = el("button", null, "Attach");
        attach.type = "button";
        attach.addEventListener("click", function () {
          callTool("runtime_attach_session", { session_id: str(session.session_id) })
            .then(function (result) { if (result) refresh(); });
        });
        row.appendChild(attach);
      }
      wrap.appendChild(row);
    });
    host.appendChild(wrap);
    note.textContent = str(model.session_note, "");
  }

  // ---- log -------------------------------------------------------------

  function renderLog(host, note) {
    var controls = el("div", "controls");
    ["ERROR", "WARN", "INFO", "DEBUG"].forEach(function (level) {
      var wrap = el("label", "toggle");
      var box = document.createElement("input");
      box.type = "checkbox";
      box.checked = logLevels[level];
      box.addEventListener("change", function () {
        logLevels[level] = box.checked;
        redrawLog();
      });
      wrap.appendChild(box);
      wrap.appendChild(el("span", null, level));
      controls.appendChild(wrap);
    });
    host.appendChild(controls);

    var wrap = el("div", "scroll");
    wrap.id = "log-table";
    host.appendChild(wrap);
    redrawLog();

    var parts = [];
    if (typeof model.log_returned === "number" && typeof model.log_available === "number") {
      parts.push("fetched " + model.log_returned + " of " + model.log_available);
    }
    if (model.log_note) parts.push(str(model.log_note, ""));
    note.textContent = parts.join("  ·  ");
  }

  function redrawLog() {
    var wrap = document.getElementById("log-table");
    if (!wrap) return;
    clear(wrap);

    var rows = arr(model.log).filter(function (record) {
      return logLevels[str(record.level, "INFO")] === true;
    }).slice(-MAX_LOG_ROWS);

    if (!rows.length) {
      wrap.appendChild(el("div", "empty",
        "Nothing recorded at those levels since this server started."));
      return;
    }

    var table = el("table", "log");
    var body = el("tbody");
    rows.forEach(function (record) {
      var level = str(record.level, "INFO");
      var tr = el("tr", /^[A-Z]{4,5}$/.test(level) ? level : "INFO");
      tr.appendChild(el("td", "ts", str(record.time, "")));
      tr.appendChild(el("td", "lvl", level));
      tr.appendChild(el("td", "tag", str(record.tag, "")));
      tr.appendChild(el("td", null, str(record.message, "")));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
  }

  // --------------------------------------------------------------------
  // Size reporting, so the host can fit the frame to the content.
  // --------------------------------------------------------------------
  var lastHeight = 0;
  function reportSize() {
    var height = Math.ceil(document.documentElement.scrollHeight);
    if (height === lastHeight) return;
    lastHeight = height;
    notify("ui/notifications/size-changed",
           { width: Math.ceil(document.documentElement.scrollWidth), height: height });
  }

  // --------------------------------------------------------------------
  // Boot
  // --------------------------------------------------------------------
  document.getElementById("refresh").addEventListener("click", function () {
    if (!busy) refresh();
  });

  render();

  send("ui/initialize", {
    protocolVersion: "2026-01-26",
    clientInfo: { name: "didi-control-room", version: "1" },
    capabilities: {},
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }
  }).then(function (result) {
    initialized = true;
    if (result && result.hostContext) applyHostContext(result.hostContext);
    render();
  }).catch(function () {
    // A host that will not initialize us still gets a page that renders
    // whatever data arrives, so there is nothing to recover here.
    initialized = false;
  });

  window.addEventListener("resize", reportSize);

})();
</script>
</body>
</html>
