<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Didi">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:image" content="https://saworbit.github.io/didi/brand/png/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="The Didi signature on a dark field: a node enters the first d of the wordmark through a pipe.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://saworbit.github.io/didi/brand/png/social-preview.png">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{root}}brand/svg/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}brand/png/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="{{root}}brand/png/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="{{root}}brand/png/didi-icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="{{root}}site.css">
<script>
(function () {
  try {
    var theme = localStorage.getItem("didi-theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (error) {}
})();
</script>
</head>
